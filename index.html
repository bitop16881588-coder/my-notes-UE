<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UE 高效知识库</title>
    <style>
        :root {
            --bg:#FCF1F4; --surface:#FFFFFF; --border:#D9EDE7; --border-strong:#C2E0D7;
            --ink:#214A43; --muted:#6E8B85; --faint:#9CBFB7;
            --accent:#1FBD9E; --accent-d:#168A75; --accent-soft:#DAF5EE;
            --side:#1C8D7B; --side-2:#157566; --side-line:#2FA48F; --side-ink:#EAF8F4; --side-muted:#A6D6CC;
            --danger:#E0664F;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; display: flex; height: 100vh; margin: 0; background: var(--bg); color: var(--ink); }
        /* 側欄 */
        #sidebar { width: 320px; background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; }
        .side-head { padding: 18px 16px 14px; background: var(--side-2); border-bottom: 1px solid var(--side-line); }
        .brand { font-size: 15px; font-weight: 700; letter-spacing: 1px; margin-bottom: 14px; }
        .side-actions { display: flex; gap: 6px; margin-top: 8px; }
        .s-btn { flex: 1; padding: 8px 6px; border: 1px solid var(--side-line); background: transparent; color: var(--side-muted);
            border-radius: 0; font-size: 13px; font-family: inherit; cursor: pointer; transition: .15s; white-space: nowrap; }
        .s-btn:hover { border-color: var(--accent); color: var(--side-ink); }
        .s-btn.primary { flex: none; width: 100%; border: none; background: var(--accent); color: #fff; font-weight: 600; padding: 11px; font-size: 14px; }
        .s-btn.primary:hover { background: var(--accent-d); }
        .s-btn.danger:hover { border-color: var(--danger); color: #F2C4B8; }
        #syncStatus { font-size: 11px; color: var(--side-muted); padding: 8px 4px 2px; }
        .side-foot { margin-top: auto; border-top: 1px solid var(--side-line); padding: 10px 12px 12px; background: var(--side-2); }
        .foot-actions { display: flex; gap: 6px; }
        #listCtrl { padding: 8px 14px; border-bottom: 1px solid var(--side-line); display: flex; justify-content: flex-end; }
        #collapseToggle { background: transparent; border: 1px solid var(--side-line); color: var(--side-muted); font-size: 12px; padding: 4px 12px; border-radius: 0; cursor: pointer; transition: .15s; }
        #collapseToggle:hover { border-color: var(--accent); color: var(--side-ink); }
        #noteList { flex: 1; overflow-y: auto; }
        .note-item { padding: 12px 16px 12px 28px; border-bottom: 1px solid var(--side-line); cursor: pointer; transition: .15s; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .note-item:hover { background: rgba(255,255,255,.06); }
        .note-item .pin { color: #F2C230; }
        /* 分类分组 */
        .cat-group .cat-header { padding: 12px 14px; background: rgba(0,0,0,.14); color: #FFFFFF; font-size: 13px; font-weight: 700;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none;
            border-bottom: 1px solid var(--side-line); letter-spacing: .5px; }
        .cat-group .cat-header:hover { color: #FFFFFF; }
        .cat-group .cat-header.pinned { color: #F2C230; }
        .cat-group .cat-header.solo { font-weight: 700; color: #FFFFFF; background: transparent; font-size: 14px; }
        .cat-group .cat-header.solo:hover { background: rgba(255,255,255,.08); color: #FFFFFF; }
        .cat-group .cat-header .left { display: flex; align-items: center; gap: 8px; }
        .cat-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,.15); }
        .cat-group .cat-header .chev { transition: .2s; font-size: 10px; display: inline-block; }
        .cat-group.collapsed .cat-body { display: none; }
        .cat-group.collapsed .chev { transform: rotate(-90deg); }
        .cat-count { background: var(--accent); color: #fff; border-radius: 0; padding: 1px 8px; font-size: 11px; min-width: 14px; text-align: center; }
        .cat-group .cat-header .right { display: flex; align-items: center; gap: 8px; }
        .cat-del { background: transparent; border: none; color: var(--side-muted); cursor: pointer; font-size: 13px; padding: 0 2px; opacity: .5; }
        .cat-del:hover { color: var(--danger); opacity: 1; }
        .cat-header.pinned .cat-count { background: #F2C230; color: var(--side-2); }
        .empty-hint { padding: 22px 18px; color: var(--side-muted); font-size: 13px; line-height: 1.8; }
        /* 右侧展示区 */
        #main { flex: 1; padding: 28px 44px 48px; overflow-y: auto; }
        /* 云端搜寻栏 */
        #searchBar, #filterBar { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--border);
            border-radius: 0; padding: 7px 7px 7px 16px; box-shadow: 0 2px 10px rgba(67,52,43,.05); margin-bottom: 24px; }
        #searchBar .lbl, #filterBar .lbl { font-size: 15px; color: var(--faint); }
        #searchBar input, #filterBar input { flex: 1; border: 0; outline: none; font-size: 15px; font-family: inherit; color: var(--ink); padding: 9px 0; background: transparent; }
        #searchBar input::placeholder, #filterBar input::placeholder { color: var(--faint); }
        .card { background: var(--surface); padding: 38px 40px; border-radius: 0; border: 1px solid var(--border); box-shadow: 0 6px 24px rgba(67,52,43,.06); }
        .card h2 { color: #0F2A24; }
        /* 按鈕系統 */
        .btn { padding: 9px 16px; border: none; border-radius: 0; cursor: pointer; font-size: 13px; font-family: inherit; transition: .15s; background: var(--accent-soft); color: var(--ink); }
        .btn:hover { filter: brightness(.97); }
        .btn.primary { background: var(--accent); color: #fff; }
        .btn.primary:hover { background: var(--accent-d); filter: none; }
        .btn.secondary { background: var(--accent-soft); color: var(--accent-d); }
        .btn.ghost { background: transparent; border: 1px solid var(--border-strong); color: var(--muted); }
        .btn.ghost:hover { border-color: var(--accent); color: var(--accent-d); filter: none; }
        .btn.warn { background: #FCEEDB; color: #B5703A; }
        .btn.danger { background: #FBE2DA; color: #C2502F; }
        .btn.danger:hover { background: #F6DAD0; filter: none; }
        /* 编辑器 */
        .editor label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
        .editor input[type=text], .editor textarea, .editor select { width: 100%; padding: 11px 13px; border: 1px solid var(--border-strong);
            border-radius: 0; font-family: inherit; font-size: 14px; box-sizing: border-box; color: var(--ink); background: var(--surface); }
        .editor input[type=text]:focus, .editor textarea:focus, .editor select:focus { outline: none; border-color: var(--accent); }
        .editor textarea { resize: vertical; line-height: 1.7; }
        .editor .row-actions { margin-top: 22px; display: flex; gap: 10px; }
        .cat-tag { display: inline-block; background: var(--accent-soft); color: var(--accent-d); font-size: 12px; padding: 3px 12px; border-radius: 0; }
        /* 選項選單 */
        .opt-wrap { position: relative; display: inline-block; margin: 0 0 22px; }
        .opt-menu { position: absolute; top: calc(100% + 4px); left: 0; background: var(--surface); border: 1px solid var(--border-strong); min-width: 150px; z-index: 50; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
        .opt-menu button { display: block; width: 100%; text-align: left; padding: 11px 16px; border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 14px; color: var(--ink); }
        .opt-menu button:hover { background: var(--accent-soft); }
        .opt-menu button.danger { color: var(--danger); }
        .opt-menu button.danger:hover { background: #FBE2DA; }
        /* 條列項目（檢視）*/
        .items-view { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
        /* 可收合的罐頭語項目（預設收合，點標題展開）*/
        .qlist { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
        .qitem { border: 1px solid var(--border); border-radius: 0; background: #F4FBF9; overflow: hidden; }
        .qitem-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; user-select: none; }
        .qitem-head:hover { background: #E7F6F1; }
        .qitem-chev { color: var(--muted); font-size: 12px; transition: .2s; flex: none; }
        .qitem.open .qitem-chev { transform: rotate(90deg); }
        .qitem-title { flex: 1; font-weight: 700; color: #0F2A24; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .qitem-head .item-copy { position: static; flex: none; }
        .qitem-more { flex: none; background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 6px; line-height: 1; }
        .qitem-more:hover { color: var(--accent-d); }
        .qitem-head { position: relative; }
        .qitem-menu { position: absolute; top: calc(100% - 4px); right: 8px; background: var(--surface); border: 1px solid var(--border-strong); min-width: 130px; z-index: 60; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
        .qitem-menu button { display: block; width: 100%; text-align: left; padding: 10px 14px; border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 14px; color: var(--ink); }
        .qitem-menu button:hover { background: var(--accent-soft); }
        .qitem-menu button.danger { color: var(--danger); }
        .qitem-body { display: none; padding: 12px 14px 14px; line-height: 1.7; color: var(--ink); border-top: 1px solid var(--border); }
        .qitem-text { white-space: pre-wrap; }
        .qboxes { display: flex; flex-direction: column; gap: 8px; }
        .qbox { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; border: 1px solid var(--border); background: #F4FBF9; padding: 9px 11px; }
        .qbox-t { white-space: pre-wrap; flex: 1; color: var(--ink); }
        .qbox-copy { flex: none; background: var(--accent-soft); color: var(--accent-d); border: none; padding: 4px 11px; font-size: 12px; cursor: pointer; }
        .qbox-copy:hover { background: var(--accent); color: #fff; }
        .qtable { border-collapse: collapse; margin: 4px 0; width: 100%; }
        .qtable th, .qtable td { border: 1px solid var(--border-strong); padding: 6px 10px; text-align: left; font-size: 13px; vertical-align: top; }
        .qtable th { background: var(--accent-soft); font-weight: 700; color: #0F2A24; }
        .qitem.open .qitem-body { display: block; }
        .qitem-img { max-width: 100%; display: block; margin-top: 10px; border: 1px solid var(--border); }
        .item-card { position: relative; border: 1px solid var(--border); border-radius: 0; padding: 14px 86px 14px 16px; background: #F4FBF9; }
        .item-card.copyable { cursor: pointer; }
        .item-card.copyable:hover { border-color: var(--accent); background: #E7F6F1; }
        .item-cat { font-size: 11px; color: var(--accent-d); background: var(--accent-soft); display: inline-block; padding: 1px 8px; border-radius: 0; margin-bottom: 6px; }
        .item-t { font-weight: 700; color: #0F2A24; margin-bottom: 6px; }
        .item-b { white-space: pre-wrap; line-height: 1.7; color: var(--ink); }
        .item-copy { position: absolute; top: 12px; right: 12px; background: var(--accent-soft); color: var(--accent-d); border: none; border-radius: 0; padding: 6px 12px; font-size: 12px; cursor: pointer; }
        .item-copy:hover { background: var(--accent); color: #fff; }
        /* 條列項目（編輯）*/
        .item-edit { border: 1px solid var(--border-strong); border-radius: 0; padding: 10px 12px; margin-bottom: 10px; background: #F4FBF9; }
        .item-edit-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
        .item-edit .it-title { flex: 1; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 0; font-family: inherit; font-size: 13px; color: var(--ink); background: #fff; }
        .item-moves { display: flex; gap: 4px; }
        .item-moves button { width: 28px; height: 28px; border: 1px solid var(--border-strong); background: #fff; border-radius: 0; cursor: pointer; color: var(--muted); font-size: 13px; line-height: 1; }
        .item-moves button:hover { border-color: var(--accent); color: var(--accent-d); }
        .item-moves .it-del:hover { border-color: var(--danger); color: var(--danger); }
        .item-edit .it-body { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 0; font-family: inherit; font-size: 13px; line-height: 1.6; resize: vertical; color: var(--ink); background: #fff; }
        /* 搜寻结果 */
        .s-row { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink);
            padding: 12px 14px; border: 1px solid var(--border); border-radius: 0; margin-bottom: 8px; transition: .15s; }
        .s-row:hover { border-color: var(--accent); background: var(--accent-soft); }
        .s-ic { flex: none; width: 38px; height: 38px; border-radius: 0; display: grid; place-items: center; font-size: 19px; background: var(--accent-soft); }
        .s-meta { flex: 1; min-width: 0; }
        .s-nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .s-sub { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
        .s-sub .tag { color: var(--accent-d); }
        .s-empty { color: var(--muted); text-align: center; padding: 40px 0; }
        .s-row .imp-btn { background: var(--accent); color: #fff; flex: none; white-space: nowrap; }
        .s-row .imp-btn:hover { background: var(--accent-d); filter: none; }
        .s-row .open-link { flex: none; text-decoration: none; color: var(--faint); font-size: 18px; padding: 0 4px; }
        .s-row .open-link:hover { color: var(--accent); }
        /* 多圖編輯器 */
        .img-drop { border: 2px dashed var(--border-strong); border-radius: 0; padding: 18px; text-align: center; color: var(--muted); font-size: 13px; background: #F4FBF9; }
        .img-drop.drag { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-d); }
        .img-pick { color: var(--accent-d); cursor: pointer; text-decoration: underline; }
        .img-thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
        .img-thumb { position: relative; width: 96px; height: 96px; border-radius: 0; overflow: hidden; border: 1px solid var(--border-strong); }
        .img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .img-thumb .img-x { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border: none; border-radius: 0; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; font-size: 12px; line-height: 1; }
        .img-thumb .img-x:hover { background: var(--danger); }
        /* 密碼鎖 */
        #lockScreen { position: fixed; inset: 0; z-index: 9999; background: var(--side); display: flex; align-items: center; justify-content: center; }
        .lock-box { background: var(--side-2); padding: 38px 34px; border-radius: 0; width: 280px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.4); }
        .lock-title { color: var(--side-ink); font-size: 18px; font-weight: 700; margin-bottom: 22px; letter-spacing: 1px; }
        .lock-box input { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--side-line); border-radius: 0; background: var(--side); color: var(--side-ink); font-size: 15px; font-family: inherit; outline: none; }
        .lock-box input:focus { border-color: var(--accent); }
        .lock-box button { width: 100%; margin-top: 14px; padding: 12px; border: none; border-radius: 0; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
        .lock-box button:hover { background: var(--accent-d); }
        #lockMsg { color: #F5BBA4; font-size: 13px; min-height: 18px; margin-top: 12px; }
    </style>
</head>
<body>

<div id="lockScreen">
    <div class="lock-box">
        <div class="lock-title">🔒 UE 知識庫</div>
        <input id="lockInput" type="password" placeholder="請輸入密碼" autocomplete="current-password">
        <button onclick="unlockApp()">進入</button>
        <div id="lockMsg"></div>
    </div>
</div>

<div id="sidebar">
    <div class="side-head">
        <div class="brand">UE 知識庫</div>
        <button class="s-btn primary" onclick="newNote()">＋ 新增筆記</button>
    </div>
    <div id="listCtrl"><button id="collapseToggle" onclick="toggleAllCats()">收合全部</button></div>
    <div id="noteList"></div>
    <div class="side-foot">
        <div class="foot-actions">
            <button class="s-btn" onclick="syncToCloud()">同步</button>
            <button class="s-btn" onclick="pullFromCloud()">刷新</button>
            <button class="s-btn" onclick="clearAllNotes()" title="清空全部">清空</button>
            <button class="s-btn" onclick="lockApp()" title="鎖定">🔒</button>
        </div>
        <div id="syncStatus">尚未登入 Google</div>
    </div>
</div>

<div id="main">
    <div id="filterBar">
        <span class="lbl">🔍</span>
        <input id="filterInput" type="text" placeholder="篩選罐頭語…打字即時搜尋，點卡片即可複製" autocomplete="off" oninput="runFilter()">
        <button class="btn ghost" onclick="openCloud()">☁ 雲端</button>
    </div>
    <div id="contentArea" class="card"></div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    let notes = JSON.parse(localStorage.getItem('ueNotes')) || [];
    let currentId = null;
    let editImgs = [];          // 編輯中暫存的圖片（dataURL 陣列）
    let imgEditActive = false;  // 是否正在編輯（決定 Ctrl+V 貼圖是否生效）

    /* ===== 網頁密碼（想換密碼就改這一行的引號內文字）===== */
    const SITE_PASSWORD = "ue1234";

    function unlockApp() {
        const v = document.getElementById('lockInput').value;
        if (v === SITE_PASSWORD) {
            sessionStorage.setItem('ueUnlocked', '1');
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('lockMsg').textContent = '';
            autoLogin();
        } else {
            document.getElementById('lockMsg').textContent = '密碼錯誤';
            const i = document.getElementById('lockInput'); i.value = ''; i.focus();
        }
    }
    function lockApp() {
        sessionStorage.removeItem('ueUnlocked');
        const ls = document.getElementById('lockScreen');
        ls.style.display = 'flex';
        const i = document.getElementById('lockInput'); i.value = ''; i.focus();
        document.getElementById('lockMsg').textContent = '';
    }
    function initLock() {
        const ls = document.getElementById('lockScreen');
        if (sessionStorage.getItem('ueUnlocked') === '1') { ls.style.display = 'none'; return; }
        ls.style.display = 'flex';
        const i = document.getElementById('lockInput'); if (i) i.focus();
    }

    /* 折叠状态记忆 */
    let collapsed = new Set(JSON.parse(localStorage.getItem('ueCollapsed') || '[]'));

    /* ===== Google 设定：只用可公开的 Client ID，没有任何密钥 ===== */
    const CLIENT_ID = "460796542989-k785gtt8fod50ivj808b7h3le7s4rvnd.apps.googleusercontent.com";
    // 同时请求：唯读全部（搜寻用）+ 只碰自己建立的档（笔记同步用）
    const SCOPE = "https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file";
    const DATA_FILENAME = "ue-notes-data.json";

    let accessToken = null;
    let tokenClient = null;
    let dataFileId = null;
    let pendingAction = null;
    let pendingQuery = "";

    function setStatus(t){ const s = document.getElementById('syncStatus'); if (s) s.textContent = t; }
    function persist(){ localStorage.setItem('ueNotes', JSON.stringify(notes)); }

    window.addEventListener('load', () => {
        const timer = setInterval(() => {
            if (window.google && google.accounts && google.accounts.oauth2) {
                clearInterval(timer);
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPE,
                    callback: (resp) => {
                        if (resp.error) { setStatus("登入失敗：" + resp.error); pendingAction = null; return; }
                        accessToken = resp.access_token;
                        setStatus("已登入 Google Drive");
                        const act = pendingAction; pendingAction = null;
                        if (act === 'sync') doSync();
                        else if (act === 'pull') doPull();
                        else if (act === 'autopull') doPull(true);
                        else if (act === 'search') doSearch(pendingQuery);
                    },
                });
            }
        }, 200);
    });

    function ensureToken(action) {
        if (accessToken) return true;
        if (!tokenClient) { alert("Google 登入元件還在載入，請稍候再試。"); return false; }
        pendingAction = action;
        tokenClient.requestAccessToken({ prompt: 'consent' });
        return false;
    }

    /* ============ 云端搜寻（drive.readonly，搜档名 + 内容）============ */
    function searchDrive() {
        const kw = document.getElementById('q').value.trim();
        if (!kw) { return; }
        pendingQuery = kw;
        if (ensureToken('search')) doSearch(kw);
    }

    async function doSearch(query) {
        query = (query || '').trim();
        if (!query) return;
        const area = document.getElementById('contentArea');
        area.innerHTML = '<h2>搜尋中…</h2>';
        const safe = query.replace(/'/g, "\\'");
        const q = `(name contains '${safe}' or fullText contains '${safe}') and trashed = false`;
        const params = new URLSearchParams({
            q,
            pageSize: "40",
            fields: "files(id,name,mimeType,modifiedTime,webViewLink,size)",
            orderBy: "modifiedTime desc",
            corpora: "user",
            spaces: "drive",
        });
        try {
            const r = await fetch("https://www.googleapis.com/drive/v3/files?" + params.toString(),
                { headers: { Authorization: 'Bearer ' + accessToken } });
            if (r.status === 401) { accessToken = null; area.innerHTML = '<h2>登入已過期</h2><p>請再按一次「搜尋」重新登入。</p>'; return; }
            if (r.status === 403) { area.innerHTML = '<h2>權限不足（403）</h2><p>請確認 Drive API 已啟用、且授權範圍包含 drive.readonly。</p>'; return; }
            if (!r.ok) { area.innerHTML = '<h2>搜尋失敗（HTTP ' + r.status + '）</h2>'; return; }
            const data = await r.json();
            renderResults(query, data.files || []);
        } catch (e) {
            area.innerHTML = '<h2>發生錯誤</h2><p>' + esc(e.message) + '</p>';
        }
    }

    function renderResults(query, files) {
        const area = document.getElementById('contentArea');
        let html = '<h2 style="margin-top:0">搜尋「' + esc(query) + '」</h2>';
        if (!files.length) {
            html += '<div class="s-empty">🗂️ 找不到符合的檔案</div>';
            area.innerHTML = html; return;
        }
        html += '<p style="color:#7f8c8d;font-size:13px">共 ' + files.length + ' 筆（依修改時間排序）。可匯入的檔案按「📥 匯入成筆記」即可變成可編輯的網頁筆記。</p>';
        window._results = {};
        files.forEach(f => { window._results[f.id] = f; });
        html += files.map(f => {
            const can = canImport(f.mimeType);
            return `
            <div class="s-row">
                <div class="s-ic">${icon(f.mimeType)}</div>
                <div class="s-meta">
                    <div class="s-nm">${esc(f.name)}</div>
                    <div class="s-sub">
                        <span class="tag">${label(f.mimeType)}</span>
                        <span>${fmtDate(f.modifiedTime)}</span>
                        ${f.size ? '<span>' + fmtSize(f.size) + '</span>' : ''}
                    </div>
                </div>
                ${can ? `<button class="btn imp-btn" onclick="importNote('${f.id}')">📥 匯入成筆記</button>` : ''}
                <a class="open-link" href="${f.webViewLink || '#'}" target="_blank" rel="noopener" title="在 Drive 開啟原檔">↗</a>
            </div>`;
        }).join('');
        area.innerHTML = html;
    }

    /* 可匯入成文字筆記的格式：Google 文件、純文字、json/rtf */
    function canImport(m) {
        if (!m) return false;
        if (m === 'application/vnd.google-apps.document') return true;
        if (m === 'application/vnd.google-apps.spreadsheet') return true;
        if (m.startsWith('text/')) return true;
        if (m === 'application/json' || m === 'application/rtf') return true;
        return false;
    }

    /* 把雲端檔案內容讀進來，建立一篇可編輯的網頁筆記 */
    async function importNote(fileId) {
        const f = (window._results || {})[fileId];
        if (!f) { alert('找不到該檔案資料，請重新搜尋後再匯入。'); return; }
        const area = document.getElementById('contentArea');
        area.innerHTML = '<h2>匯入中…</h2>';
        if (f.mimeType === 'application/vnd.google-apps.spreadsheet') { importSheet(fileId, f); return; }
        try {
            const url = (f.mimeType === 'application/vnd.google-apps.document')
                ? `https://www.googleapis.com/drive/v3/files/${fileId}/export?mimeType=text/plain`
                : `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;
            const r = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
            if (r.status === 401) { accessToken = null; area.innerHTML = '<h2>登入已過期</h2><p>請再搜尋一次重新登入後，再按匯入。</p>'; return; }
            if (!r.ok) { area.innerHTML = '<h2>匯入失敗（HTTP ' + r.status + '）</h2><p>此檔案可能不支援文字匯入。</p>'; return; }
            const text = await r.text();
            const id = Date.now();
            const title = f.name.replace(/\.(txt|md|json|rtf)$/i, '');
            notes.push({ id, title, content: text, img: '', isPinned: false, category: '匯入' });
            persist(); render(); viewNote(id);
            setStatus('已匯入「' + f.name + '」，記得按「云同步」存回 Drive');
        } catch (e) {
            area.innerHTML = '<h2>匯入發生錯誤</h2><p>' + esc(e.message) + '</p>';
        }
    }

    /* ===== 從 Google 試算表匯入：每一列變一篇筆記 ===== */
    function parseCSV(text) {
        const rows = []; let row = []; let field = ''; let i = 0; let inQ = false;
        while (i < text.length) {
            const c = text[i];
            if (inQ) {
                if (c === '"') { if (text[i + 1] === '"') { field += '"'; i += 2; continue; } inQ = false; i++; continue; }
                field += c; i++; continue;
            } else {
                if (c === '"') { inQ = true; i++; continue; }
                if (c === ',') { row.push(field); field = ''; i++; continue; }
                if (c === '\r') { i++; continue; }
                if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
                field += c; i++; continue;
            }
        }
        if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
        return rows;
    }

    async function importSheet(fileId, f) {
        const area = document.getElementById('contentArea');
        try {
            // 1) 取得所有分頁（工作表）的名稱
            const metaUrl = `https://sheets.googleapis.com/v4/spreadsheets/${fileId}?fields=sheets.properties(title)`;
            const mr = await fetch(metaUrl, { headers: { Authorization: 'Bearer ' + accessToken } });
            if (mr.status === 401) { accessToken = null; area.innerHTML = '<h2>登入已過期</h2><p>請再搜尋一次重新登入後，再按匯入。</p>'; return; }
            if (mr.status === 403) { area.innerHTML = sheetsApiHelp(); return; }
            if (!mr.ok) { area.innerHTML = '<h2>讀取試算表失敗（HTTP ' + mr.status + '）</h2>'; return; }
            const meta = await mr.json();
            const titles = (meta.sheets || []).map(s => s.properties.title);
            if (!titles.length) { area.innerHTML = '<h2>這份試算表沒有分頁</h2>'; return; }
            // 2) 一次抓所有分頁的內容
            const params = new URLSearchParams();
            titles.forEach(t => params.append('ranges', "'" + String(t).replace(/'/g, "''") + "'"));
            params.append('majorDimension', 'ROWS');
            const vr = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${fileId}/values:batchGet?` + params.toString(),
                { headers: { Authorization: 'Bearer ' + accessToken } });
            if (vr.status === 403) { area.innerHTML = sheetsApiHelp(); return; }
            if (!vr.ok) { area.innerHTML = '<h2>讀取分頁內容失敗（HTTP ' + vr.status + '）</h2>'; return; }
            const data = await vr.json();
            const ranges = data.valueRanges || [];
            const sheets = titles.map((t, i) => ({ title: t, rows: (ranges[i] && ranges[i].values) || [] }));
            window._sheets = sheets;
            renderSheetMapping2(sheets, f.name);
        } catch (e) {
            area.innerHTML = '<h2>讀取試算表發生錯誤</h2><p>' + esc(e.message) + '</p>';
        }
    }

    function sheetsApiHelp() {

            <ol style="line-height:2;color:#214A43">
                <li>開啟 <a href="https://console.cloud.google.com/apis/library/sheets.googleapis.com" target="_blank" rel="noopener">Google Sheets API 啟用頁</a></li>
                <li>確認左上角的「專案」是這個 App 在用的同一個專案</li>
                <li>按藍色的「啟用 / Enable」</li>
                <li>等 1～2 分鐘，回來重新搜尋、再按一次「📥 匯入成筆記」</li>

    function renderSheetMapping2(sheets, name) {
        const selStyle = 'width:100%;padding:10px;border:1px solid #DCC8E6;border-radius:0;font-family:inherit;font-size:14px;color:#214A43';
        const list = sheets.map(s => `<li>${esc(s.title)}　<span style="color:#9A86A8">（${s.rows.length} 列）</span></li>`).join('');
        document.getElementById('contentArea').innerHTML = `
            <div class="editor">
                <h2 style="margin-top:0">匯入試算表：${esc(name)}</h2>
                <p style="color:#9A86A8;font-size:13px">找到 <b>${sheets.length}</b> 個分頁：</p>
                <ul style="line-height:1.9;color:#214A43;margin:6px 0 14px;padding-left:22px">${list}</ul>
                <label>匯入方式</label>
                <select id="sheetCellMode" style="${selStyle}">
                    <option value="merge" selected>整個分頁＝一頁筆記（分頁名稱當標題，內容全放同一頁）</option>
                    <option value="row">每一列＝一則（分頁名稱當分類）</option>
                    <option value="cell">每個儲存格＝一則（分頁名稱當分類）</option>
                </select>
                <label style="display:flex;align-items:center;gap:8px;margin-top:16px;cursor:pointer;color:#9A86A8">
                    <input type="checkbox" id="sheetSkipHeader"> 略過每個分頁的第一列（如果第一列是欄位標題）
                </label>
                <div class="row-actions">
                    <button class="btn primary" onclick="doImportSheets2()">開始匯入</button>
                    <button class="btn ghost" onclick="showWelcome()">取消</button>
                </div>
            </div>`;
    }

    function doImportSheets2() {
        const sheets = window._sheets || [];
        const mode = document.getElementById('sheetCellMode').value;
        const skip = document.getElementById('sheetSkipHeader').checked;
        let added = 0, firstId = null;
        const mkTitle = (txt) => { const fl = (txt || '').split('\n')[0]; return fl.length > 30 ? fl.slice(0, 30) + '…' : fl; };
        const add1 = (title, content, category) => {
            const id = Date.now() + added;
            if (firstId === null) firstId = id;
            notes.push({ id, title: title || '(無標題)', content: content || '', imgs: [], img: '', isPinned: false, category });
            added++;
        };
        sheets.forEach(s => {
            const cat = (s.title || '').trim() || '未命名分頁';
            let rows = s.rows || [];
            if (skip) rows = rows.slice(1);
            if (mode === 'merge') {
                // 整個分頁＝一頁：分頁名稱當標題；每一列變成一個「項目」
                const its = rows.map(r => {
                    const cells = (r || []).map(c => (c == null ? '' : String(c)).trim());
                    const nonEmpty = cells.filter(Boolean);
                    if (!nonEmpty.length) return null;
                    if (cells.length >= 2 && cells[0]) return { t: cells[0], b: cells.slice(1).filter(Boolean).join('\n') };
                    return { t: '', b: nonEmpty.join('\n') };
                }).filter(Boolean);
                if (!its.length) return;
                const id = Date.now() + added;
                if (firstId === null) firstId = id;
                notes.push({ id, title: cat, content: '', items: its, imgs: [], img: '', isPinned: false, category: cat });
                added++;
            } else if (mode === 'row') {
                rows.forEach(r => {
                    const cells = (r || []).map(c => (c == null ? '' : String(c)).trim()).filter(x => x);
                    if (!cells.length) return;
                    add1(mkTitle(cells.join('\n')), cells.join('\n'), cat);
                });
            } else {
                rows.forEach(r => (r || []).forEach(c => {
                    const cell = (c == null ? '' : String(c)).trim();
                    if (cell) add1(mkTitle(cell), cell, cat);
                }));
            }
        });
        persist(); render();
        if (added) { viewNote(firstId); setStatus('已依分頁匯入 ' + added + ' 篇，記得按「云同步」存回 Drive'); }
        else { showWelcome(); alert('沒有可匯入的資料。'); }
    }

    function renderSheetMapping(rows, name) {
        const cols = Math.max(...rows.map(r => r.length));
        const head = rows[0] || [];
        const colLabel = k => '第' + (k + 1) + '欄' + (head[k] ? '（' + esc(String(head[k]).slice(0, 12)) + '）' : '');
        const opt = (sel) => { let s = ''; for (let k = 0; k < cols; k++) s += `<option value="${k}" ${k === sel ? 'selected' : ''}>${colLabel(k)}</option>`; return s; };
        const catOpt = () => { let s = '<option value="-1" selected>（不指定，全部歸到「匯入」）</option>'; for (let k = 0; k < cols; k++) s += `<option value="${k}">${colLabel(k)}</option>`; return s; };
        const prev = rows.slice(0, 4).map(r => '<tr>' + Array.from({ length: cols }, (_, k) =>
            '<td style="border:1px solid #DCC8E6;padding:5px 8px;font-size:12px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(String(r[k] ?? '')) + '</td>').join('') + '</tr>').join('');
        const selStyle = 'width:100%;padding:10px;border:1px solid #DCC8E6;border-radius:0;font-family:inherit;font-size:14px;color:#214A43';
        document.getElementById('contentArea').innerHTML = `
            <div class="editor">
                <h2 style="margin-top:0">匯入試算表：${esc(name)}</h2>
                <p style="color:#7f8c8d;font-size:13px">共 ${rows.length} 列、${cols} 欄。</p>
                <div style="overflow-x:auto;margin:8px 0 2px"><table style="border-collapse:collapse">${prev}</table></div>
                <p style="color:#9A86A8;font-size:12px;margin:0 0 4px">↑ 預覽前幾列</p>
                <label>匯入方式</label>
                <select id="importMode" style="${selStyle}" onchange="toggleImportMode()">
                    <option value="cell" selected>每格＝一則（最上面那列當分類名稱）｜適合罐頭語</option>
                    <option value="row">每一列＝一則（自己對應標題／內容／分類欄）</option>
                </select>
                <div id="cellModeHint" style="color:#7f8c8d;font-size:13px;margin-top:10px;line-height:1.6">
                    會把<b>每一欄最上面那格</b>當「分類」，下面每個非空白儲存格<b>各自變成一則筆記</b>（標題自動取開頭幾個字，內容是整格文字）。
                </div>
                <div id="rowMapBlock" style="display:none">
                    <label>標題欄</label>
                    <select id="mapTitle" style="${selStyle}">${opt(0)}</select>
                    <label>內容欄</label>
                    <select id="mapContent" style="${selStyle}">${opt(cols > 1 ? 1 : 0)}</select>
                    <label>分類欄（可不選）</label>
                    <select id="mapCat" style="${selStyle}">${catOpt()}</select>
                    <label style="display:flex;align-items:center;gap:8px;margin-top:16px;cursor:pointer;color:#566573">
                        <input type="checkbox" id="mapHeader" checked> 第一列是標題列（略過不匯入）
                    </label>
                </div>
                <div class="row-actions">
                    <button class="btn primary" onclick="doImportSheet()">開始匯入</button>
                    <button class="btn ghost" onclick="showWelcome()">取消</button>
                </div>
            </div>`;
    }

    function toggleImportMode() {
        const mode = document.getElementById('importMode').value;
        document.getElementById('rowMapBlock').style.display = mode === 'row' ? 'block' : 'none';
        document.getElementById('cellModeHint').style.display = mode === 'cell' ? 'block' : 'none';
    }

    function doImportSheet() {
        const rows = window._sheetRows || [];
        const mode = (document.getElementById('importMode') || {}).value || 'cell';
        let added = 0, firstId = null;
        const pushNote = (title, content, category) => {
            const id = Date.now() + added;
            if (firstId === null) firstId = id;
            notes.push({ id, title: title || '(無標題)', content: content || '', imgs: [], img: '', isPinned: false, category });
            added++;
        };
        if (mode === 'cell') {
            const headers = rows[0] || [];
            const cols = Math.max(...rows.map(r => r.length));
            for (let c = 0; c < cols; c++) {
                const cat = (headers[c] || '').trim() || ('第' + (c + 1) + '欄');
                for (let r = 1; r < rows.length; r++) {
                    const cell = ((rows[r] || [])[c] || '').trim();
                    if (!cell) continue;
                    const firstLine = cell.split('\n')[0];
                    const title = firstLine.length > 30 ? firstLine.slice(0, 30) + '…' : firstLine;
                    pushNote(title, cell, cat);
                }
            }
        } else {
            const tI = +document.getElementById('mapTitle').value;
            const cI = +document.getElementById('mapContent').value;
            const catI = +document.getElementById('mapCat').value;
            const skip = document.getElementById('mapHeader').checked;
            const data = skip ? rows.slice(1) : rows;
            data.forEach(r => {
                const title = (r[tI] || '').trim();
                const content = (r[cI] || '').trim();
                if (!title && !content) return;
                const category = catI >= 0 ? (r[catI] || '').trim() : '匯入';
                pushNote(title, content, category);
            });
        }
        persist(); render();
        if (added) { viewNote(firstId); setStatus('已從試算表匯入 ' + added + ' 篇，記得按「云同步」存回 Drive'); }
        else { showWelcome(); alert('沒有可匯入的資料。'); }
    }

    function icon(m){ if(!m)return"📄"; if(m.includes("folder"))return"📁"; if(m.includes("document"))return"📝";
        if(m.includes("spreadsheet"))return"📊"; if(m.includes("presentation"))return"📽️"; if(m==="application/pdf")return"📕";
        if(m.startsWith("image/"))return"🖼️"; if(m.startsWith("video/"))return"🎬"; if(m.startsWith("audio/"))return"🎵"; return"📄"; }
    function label(m){ if(!m)return"檔案"; if(m.includes("folder"))return"資料夾"; if(m.includes("document"))return"Google 文件";
        if(m.includes("spreadsheet"))return"Google 試算表"; if(m.includes("presentation"))return"Google 簡報"; if(m==="application/pdf")return"PDF";
        if(m.startsWith("image/"))return"圖片"; if(m.startsWith("video/"))return"影片"; return"檔案"; }
    function fmtDate(s){ if(!s)return""; const d=new Date(s); return d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0"); }
    function fmtSize(b){ b=+b; if(!b)return""; const u=["B","KB","MB","GB"]; let i=0; while(b>=1024&&i<u.length-1){b/=1024;i++;} return b.toFixed(b<10&&i>0?1:0)+u[i]; }
    function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

    /* ============ 笔记同步到 Google Drive（drive.file）============ */
    async function findDataFile() {
        if (dataFileId) return dataFileId;
        const q = encodeURIComponent(`name='${DATA_FILENAME}' and trashed=false`);
        const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`,
            { headers: { Authorization: 'Bearer ' + accessToken } });
        if (r.status === 401) { accessToken = null; throw { code: 401 }; }
        if (!r.ok) throw new Error('查詢檔案失敗 HTTP ' + r.status);
        const d = await r.json();
        if (d.files && d.files.length) dataFileId = d.files[0].id;
        return dataFileId;
    }

    function syncToCloud(){ if (ensureToken('sync')) doSync(); }
    async function doSync() {
        try {
            setStatus("同步中…");
            const body = JSON.stringify(notes);
            let id = await findDataFile();
            let r;
            if (id) {
                r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,
                    { method: 'PATCH', headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' }, body });
            } else {
                const boundary = 'ueb' + Date.now();
                const meta = { name: DATA_FILENAME, mimeType: 'application/json' };
                const multipart =
                    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n` +
                    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
                r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
                    { method: 'POST', headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'multipart/related; boundary=' + boundary }, body: multipart });
                if (r.ok) { const d = await r.json(); dataFileId = d.id; }
            }
            if (r.status === 401) { accessToken = null; setStatus("登入過期"); alert("登入已過期，請再按一次「云同步」。"); return; }
            if (!r.ok) { console.error(await r.text()); setStatus("同步失敗 HTTP " + r.status); alert("❌ 同步失敗（HTTP " + r.status + "）"); return; }
            localStorage.setItem('ueNotes', JSON.stringify(notes));
            setStatus("已同步到 Google Drive ✓");
            alert("✅ 云同步完成！（已存到你的 Google Drive）");
        } catch (e) {
            if (e && e.code === 401) { setStatus("登入過期"); alert("登入已過期，請再按一次「云同步」。"); return; }
            setStatus("同步錯誤"); alert("同步發生錯誤：" + (e.message || e));
        }
    }

    function pullFromCloud(){ if (ensureToken('pull')) doPull(); }
    async function doPull(quiet) {
        try {
            setStatus("讀取中…");
            const id = await findDataFile();
            if (!id) { setStatus("雲端尚無資料"); if (!quiet) alert("雲端還沒有資料（你還沒同步過）。"); return; }
            const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,
                { headers: { Authorization: 'Bearer ' + accessToken } });
            if (r.status === 401) { accessToken = null; setStatus("登入過期"); if (!quiet) alert("登入已過期，請再按一次「刷新」。"); return; }
            if (!r.ok) { setStatus("讀取失敗 HTTP " + r.status); if (!quiet) alert("❌ 讀取失敗（HTTP " + r.status + "）"); return; }
            notes = await r.json();
            // 旧资料相容：补上 category 栏位
            notes = (notes || []).map(n => ({ category: '', ...n }));
            localStorage.setItem('ueNotes', JSON.stringify(notes));
            render();
            setStatus("已從 Google Drive 載入 ✓");
            if (!quiet) alert("✅ 数据已同步！");
        } catch (e) {
            if (e && e.code === 401) { setStatus("登入過期"); if (!quiet) alert("登入已過期，請再按一次「刷新」。"); return; }
            setStatus("讀取錯誤"); if (!quiet) alert("讀取發生錯誤：" + (e.message || e));
        }
    }

    /* 進入後自動登入 Google 並抓雲端資料（在「進入」按鈕的點擊事件中呼叫，避免被擋彈窗）*/
    function autoLogin() {
        if (accessToken) { doPull(true); return; }
        if (tokenClient) { pendingAction = 'autopull'; tokenClient.requestAccessToken({ prompt: '' }); return; }
        let tries = 0;
        const t = setInterval(() => {
            if (tokenClient) { clearInterval(t); pendingAction = 'autopull'; tokenClient.requestAccessToken({ prompt: '' }); }
            else if (++tries > 25) { clearInterval(t); setStatus('Google 元件載入中，請按「刷新」登入'); }
        }, 200);
    }

    /* ============ 分类与侧栏渲染 ============ */
    function uniqueCats() {
        const set = new Set();
        notes.forEach(n => { const c = (n.category || '').trim(); if (c) set.add(c); });
        return [...set].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
    }

    function toggleCat(key) {
        if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key);
        localStorage.setItem('ueCollapsed', JSON.stringify([...collapsed]));
        render();
    }

    /* 目前畫面上所有分組的 key（含置頂、未分類）*/
    function allCatKeys() {
        const keys = [];
        if (notes.some(n => n.isPinned)) keys.push('__pinned__');
        uniqueCats().forEach(c => keys.push(c));
        if (notes.some(n => !n.isPinned && !(n.category || '').trim())) keys.push('__uncat__');
        return keys;
    }

    /* 一鍵收合 / 展開全部 */
    function toggleAllCats() {
        const keys = allCatKeys();
        const allCol = keys.length > 0 && keys.every(k => collapsed.has(k));
        if (allCol) keys.forEach(k => collapsed.delete(k));
        else keys.forEach(k => collapsed.add(k));
        localStorage.setItem('ueCollapsed', JSON.stringify([...collapsed]));
        render();
    }

    function updateCollapseToggle() {
        const btn = document.getElementById('collapseToggle');
        if (!btn) return;
        // 是否有可收合的群組（置頂、或含多頁、或單頁但標題不等於分類名）
        let collapsible = notes.some(n => n.isPinned);
        if (!collapsible) {
            for (const cat of [...uniqueCats(), '']) {
                const items = notes.filter(n => !n.isPinned && (n.category || '') === cat);
                if (items.length > 1) { collapsible = true; break; }
                if (items.length === 1 && items[0].title !== (cat || '未分類')) { collapsible = true; break; }
            }
        }
        btn.style.visibility = collapsible ? 'visible' : 'hidden';
        const keys = allCatKeys();
        const allCol = keys.length > 0 && keys.every(k => collapsed.has(k));
        btn.textContent = allCol ? '展開全部' : '收合全部';
    }

    function noteItemHTML(n) {
        return `<div class="note-item" onclick="viewNote(${n.id})">
            <span>${n.isPinned ? '<span class="pin">📌</span> ' : ''}${esc(n.title)}</span>
        </div>`;
    }

    const CAT_COLORS = ['#1FBD9E', '#3B9BD6', '#E0A93B', '#E0664F', '#9B6AD8', '#E06699', '#6CB04E', '#E08A3B', '#4FB0C2', '#C2557E'];
    function catColor(name) {
        let h = 0; const s = name || '';
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
        return CAT_COLORS[h % CAT_COLORS.length];
    }

    function groupHTML(key, name, items, pinned) {
        const col = collapsed.has(key);
        const del = pinned ? '' : `<button class="cat-del" data-key="${esc(key)}" title="刪除此分類所有筆記">🗑</button>`;
        const dot = pinned ? '' : `<span class="cat-dot" style="background:${catColor(name)}"></span>`;
        // 單頁分類：整類只有一頁、且標題＝分類名 → 直接點標題開啟，不再多列一條
        if (!pinned && items.length === 1 && items[0].title === name) {
            return `<div class="cat-group">
                <div class="cat-header solo" data-open="${items[0].id}">
                    <span class="left">${dot}${esc(name)}</span>
                    <span class="right">${del}</span>
                </div>
            </div>`;
        }
        return `<div class="cat-group ${col ? 'collapsed' : ''}">
            <div class="cat-header ${pinned ? 'pinned' : ''}" data-key="${esc(key)}">
                <span class="left"><span class="chev">▾</span>${dot}${esc(name)}</span>
                <span class="right">${del}<span class="cat-count">${items.length}</span></span>
            </div>
            <div class="cat-body">${items.map(noteItemHTML).join('')}</div>
        </div>`;
    }

    function deleteCategory(key) {
        const cat = key === '__uncat__' ? '' : key;
        const targets = notes.filter(n => !n.isPinned && (n.category || '') === cat);
        if (!targets.length) return;
        const name = cat || '未分類';
        if (!confirm('確定刪除「' + name + '」分類底下的 ' + targets.length + ' 篇筆記？此動作無法復原。')) return;
        const ids = new Set(targets.map(n => n.id));
        notes = notes.filter(n => !ids.has(n.id));
        persist(); render();
        if (currentId !== null && ids.has(currentId)) showWelcome();
        setStatus('已刪除「' + name + '」分類（' + targets.length + ' 篇），記得按云同步更新雲端');
    }

    function clearAllNotes() {
        if (!notes.length) { alert('目前沒有筆記。'); return; }
        if (!confirm('確定刪除全部 ' + notes.length + ' 篇筆記？此動作無法復原。\n（雲端要等你按「云同步」才會跟著清空）')) return;
        if (!confirm('再次確認：真的要清空「全部」筆記嗎？')) return;
        notes = [];
        persist(); render(); showWelcome();
        setStatus('已清空全部筆記，按「云同步」會同步清空雲端');
    }

    function render() {
        const list = document.getElementById('noteList');
        if (!notes.length) {
            list.innerHTML = '<div class="empty-hint">還沒有筆記。<br>按上方「新建」開始建立，並可指定分類。</div>';
            updateCollapseToggle();
            return;
        }
        let html = '';
        const pinned = notes.filter(n => n.isPinned);
        if (pinned.length) html += groupHTML('__pinned__', '📌 置頂', pinned, true);

        const order = [...uniqueCats(), '']; // '' = 未分类，排最后
        order.forEach(cat => {
            const items = notes.filter(n => !n.isPinned && (n.category || '') === cat);
            if (!items.length) return;
            html += groupHTML(cat || '__uncat__', cat || '未分類', items, false);
        });
        list.innerHTML = html;
        updateCollapseToggle();
    }

    /* 折叠点击（事件委派，避免分类名含特殊字元出错）*/
    document.getElementById('noteList').addEventListener('click', e => {
        const del = e.target.closest('.cat-del');
        if (del) { e.stopPropagation(); deleteCategory(del.dataset.key); return; }
        const open = e.target.closest('.cat-header.solo');
        if (open) { viewNote(+open.dataset.open); return; }
        const h = e.target.closest('.cat-header');
        if (h) toggleCat(h.dataset.key);
    });

    /* ============ 查看 / 编辑 / 新增 ============ */
    function welcomeHTML() {
        return `<h2 style="margin-top:0">UE 知識庫</h2>
            <p style="line-height:1.9;color:#9A86A8">
            ・ 上方<b>篩選框</b>打字 → 立刻列出符合的罐頭語，點卡片即可<b>複製</b>。<br>
            ・ 左側點<b>分類</b>可看整頁內容。<br>
            ・ 第一次用、或要更新資料：右上「<b>☁ 雲端</b>」搜尋並匯入你的試算表，再按底部「<b>同步</b>」存回雲端。</p>`;
    }
    function showWelcome(){ currentId = null; imgEditActive = false; document.getElementById('contentArea').innerHTML = welcomeHTML(); }

    /* ===== 即時篩選罐頭語（打字即時、點卡片複製）===== */
    function runFilter() {
        const el = document.getElementById('filterInput');
        const raw = el ? el.value.trim() : '';
        const q = raw.toLowerCase();
        const area = document.getElementById('contentArea');
        if (!q) { showWelcome(); return; }
        const hits = [];
        notes.forEach(n => {
            const cat = n.category || '未分類';
            const items = itemsOf(n);
            if (items) {
                items.forEach(it => {
                    const t = it.t || '', b = it.b || '';
                    if ((t + '\n' + b + '\n' + cat).toLowerCase().includes(q)) hits.push({ cat, t, b });
                });
            } else {
                const t = n.title || '', b = n.content || '';
                if ((t + '\n' + b + '\n' + cat).toLowerCase().includes(q)) hits.push({ cat, t, b });
            }
        });
        window._filterHits = hits;
        if (!hits.length) { area.innerHTML = `<div class="s-empty">找不到含「${esc(raw)}」的內容</div>`; return; }
        area.innerHTML = `<p style="color:#9A86A8;font-size:13px;margin:0 0 14px">符合「${esc(raw)}」的 ${hits.length} 則 — 點卡片即可複製</p>
            <div class="items-view">` +
            hits.map((h, i) => `
                <div class="item-card copyable" onclick="copyHit(${i})">
                    <div class="item-cat">${esc(h.cat)}</div>
                    ${h.t ? `<div class="item-t">${esc(h.t)}</div>` : ''}
                    <div class="item-b">${esc(h.b)}</div>
                    <button class="item-copy" onclick="event.stopPropagation();copyHit(${i})">複製</button>
                </div>`).join('') + `</div>`;
    }
    function copyHit(i) {
        const h = (window._filterHits || [])[i];
        if (!h) return;
        const text = h.b || h.t || '';
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => setStatus('已複製 ✓')).catch(() => setStatus('複製失敗，請手動選取'));
    }

    /* 雲端搜尋 / 匯入面板（要用才開）*/
    function openCloud() {
        imgEditActive = false;
        document.getElementById('contentArea').innerHTML = `
            <h2 style="margin-top:0">雲端搜尋 / 匯入</h2>
            <div id="searchBar" style="margin-top:14px">
                <span class="lbl">🔍</span>
                <input id="q" type="text" placeholder="搜尋 Google Drive 的試算表或文件，按 Enter" autocomplete="off" onkeydown="if(event.key==='Enter')searchDrive()">
                <button class="btn primary" onclick="searchDrive()">搜尋</button>
            </div>
            <p style="color:#9A86A8;font-size:13px;line-height:1.7">找到檔案後按「📥 匯入成筆記」即可加進來。試算表會依分頁變成一頁一頁的條列卡片。</p>`;
        const i = document.getElementById('q'); if (i) i.focus();
    }

    /* 取得一篇筆記的圖片陣列（相容舊的單張 img 欄位）*/
    function imgsOf(n) {
        if (Array.isArray(n.imgs)) return n.imgs;
        return n.img ? [n.img] : [];
    }

    /* 圖片編輯器 UI（拖曳 / Ctrl+V / 選檔，多張）*/
    function imgEditorHTML() {
        return `
            <label>圖片（可多張：直接拖曳、Ctrl+V 貼上，或選檔）</label>
            <div id="imgDrop" class="img-drop" tabindex="0">拖曳圖片到這裡、或按 Ctrl+V 貼上、或
                <label class="img-pick">選擇檔案<input type="file" accept="image/*" multiple style="display:none" onchange="addImgFiles(this.files); this.value='';"></label>
            </div>
            <div id="imgThumbs" class="img-thumbs"></div>`;
    }
    function renderImgThumbs() {
        const box = document.getElementById('imgThumbs');
        if (!box) return;
        box.innerHTML = editImgs.map((src, i) =>
            `<div class="img-thumb"><img src="${src}"><button type="button" class="img-x" onclick="removeImg(${i})">✕</button></div>`).join('');
    }
    function addImgFiles(files) {
        [...files].forEach(f => {
            if (!f.type || !f.type.startsWith('image/')) return;
            const r = new FileReader();
            r.onload = e => { editImgs.push(e.target.result); renderImgThumbs(); };
            r.readAsDataURL(f);
        });
    }
    function removeImg(i) { editImgs.splice(i, 1); renderImgThumbs(); }
    function bindImgDrop() {
        const dz = document.getElementById('imgDrop');
        if (!dz) return;
        dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
        dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
        dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); addImgFiles(e.dataTransfer.files); });
    }
    function onPasteImage(e) {
        if (!imgEditActive) return;
        const items = (e.clipboardData || {}).items || [];
        let used = false;
        for (const it of items) {
            if (it.type && it.type.startsWith('image/')) { const f = it.getAsFile(); if (f) { addImgFiles([f]); used = true; } }
        }
        if (used) e.preventDefault();
    }

    /* ===== 結構化條列項目（罐頭語等）===== */
    let editItems = [];
    function itemsOf(n) { return Array.isArray(n.items) ? n.items : null; }

    function renderItemsEditor() {
        const box = document.getElementById('itemsBox');
        if (!box) return;
        box.innerHTML = editItems.map((it, i) => `
            <div class="item-edit">
                <div class="item-edit-head">
                    <input type="text" class="it-title" placeholder="標題（可空）" value="${esc(it.t || '')}">
                    <span class="item-moves">
                        <button type="button" onclick="moveItem(${i},-1)" title="上移">↑</button>
                        <button type="button" onclick="moveItem(${i},1)" title="下移">↓</button>
                        <button type="button" class="it-del" onclick="removeItem(${i})" title="刪除">✕</button>
                    </span>
                </div>
                <textarea class="it-body" rows="3" placeholder="內容">${esc(it.b || '')}</textarea>
            </div>`).join('');
    }
    function syncItemsFromDOM() {
        const box = document.getElementById('itemsBox');
        if (!box) return;
        editItems = [...box.querySelectorAll('.item-edit')].map(r => ({
            t: r.querySelector('.it-title').value,
            b: r.querySelector('.it-body').value
        }));
    }
    function addItem() { syncItemsFromDOM(); editItems.push({ t: '', b: '' }); renderItemsEditor(); }
    function removeItem(i) { syncItemsFromDOM(); editItems.splice(i, 1); renderItemsEditor(); }
    function moveItem(i, dir) {
        syncItemsFromDOM();
        const j = i + dir;
        if (j < 0 || j >= editItems.length) return;
        const tmp = editItems[i]; editItems[i] = editItems[j]; editItems[j] = tmp;
        renderItemsEditor();
    }
    function toggleQ(head) { head.parentElement.classList.toggle('open'); }

    function toggleOptMenu(e) {
        e.stopPropagation();
        const m = document.getElementById('optMenu');
        if (!m) return;
        m.hidden = !m.hidden;
        if (!m.hidden) setTimeout(() => document.addEventListener('click', closeOptMenuOnce, { once: true }), 0);
    }
    function closeOptMenuOnce() { const m = document.getElementById('optMenu'); if (m) m.hidden = true; }

    function renderItemBody(text) {
        const raw = text || '';
        const lines = raw.split('\n');
        const nonEmpty = lines.filter(l => l.trim() !== '');
        if (!nonEmpty.length) return '';
        const tabbed = nonEmpty.filter(l => l.includes('\t'));
        // 多數行含 Tab → 渲染成表格
        if (nonEmpty.length >= 2 && tabbed.length >= Math.ceil(nonEmpty.length * 0.6)) {
            let html = '<table class="qtable">';
            nonEmpty.forEach((l, i) => {
                const cells = l.split('\t');
                const tg = i === 0 ? 'th' : 'td';
                html += '<tr>' + cells.map(c => `<${tg}>${esc(c.trim())}</${tg}>`).join('') + '</tr>';
            });
            return html + '</table>';
        }
        // 否則：每一行 → 一個小框框（各自可複製）
        return '<div class="qboxes">' + nonEmpty.map(line =>
            `<div class="qbox"><span class="qbox-t">${esc(line)}</span><button class="qbox-copy" onclick="copyText(this)">複製</button></div>`
        ).join('') + '</div>';
    }
    function copyText(btn) {
        const t = btn.parentElement.querySelector('.qbox-t');
        if (!t) return;
        if (navigator.clipboard) navigator.clipboard.writeText(t.textContent).then(() => setStatus('已複製 ✓')).catch(() => setStatus('複製失敗'));
    }

    function copyItem(id, idx) {
        const n = notes.find(n => n.id === id);
        if (!n || !n.items || !n.items[idx]) return;
        const text = n.items[idx].b || n.items[idx].t || '';
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => setStatus('已複製 ✓')).catch(() => setStatus('複製失敗，請手動選取'));
    }

    function toggleItemMenu(btn) {
        const menu = btn.nextElementSibling;
        if (!menu) return;
        document.querySelectorAll('.qitem-menu').forEach(m => { if (m !== menu) m.hidden = true; });
        menu.hidden = !menu.hidden;
        if (!menu.hidden) setTimeout(() => document.addEventListener('click', () => { menu.hidden = true; }, { once: true }), 0);
    }
    function itemToTop(id, idx) {
        const n = notes.find(n => n.id === id);
        if (!n || !n.items) return;
        const [it] = n.items.splice(idx, 1);
        n.items.unshift(it);
        persist(); viewNote(id); setStatus('已移到最上');
    }
    function itemDelete(id, idx) {
        const n = notes.find(n => n.id === id);
        if (!n || !n.items) return;
        if (!confirm('確定刪除這一則？')) return;
        n.items.splice(idx, 1);
        persist(); viewNote(id); setStatus('已刪除一則，記得按同步');
    }
    function itemEditInline(id, idx) {
        const n = notes.find(n => n.id === id);
        if (!n || !n.items || !n.items[idx]) return;
        const it = n.items[idx];
        editImgs = Array.isArray(it.imgs) ? it.imgs.slice() : [];
        imgEditActive = true;
        document.getElementById('contentArea').innerHTML = `
            <div class="editor">
                <h2 style="margin-top:0">編輯這一則</h2>
                <label>標題（可空）</label>
                <input type="text" id="oneT" value="${esc(it.t || '')}">
                <label>內容</label>
                <textarea id="oneB" rows="6">${esc(it.b || '')}</textarea>
                ${imgEditorHTML()}
                <div class="row-actions">
                    <button class="btn primary" onclick="saveOneItem(${id},${idx})">保存</button>
                    <button class="btn ghost" onclick="viewNote(${id})">取消</button>
                </div>
            </div>`;
        renderImgThumbs(); bindImgDrop();
    }
    function saveOneItem(id, idx) {
        const n = notes.find(n => n.id === id);
        if (!n || !n.items || !n.items[idx]) return;
        n.items[idx] = { t: document.getElementById('oneT').value, b: document.getElementById('oneB').value, imgs: editImgs.slice() };
        imgEditActive = false;
        persist(); viewNote(id); setStatus('已更新');
    }
    function itemAddNew(id) {
        const n = notes.find(n => n.id === id);
        if (!n) return;
        editImgs = []; imgEditActive = true;
        document.getElementById('contentArea').innerHTML = `
            <div class="editor">
                <h2 style="margin-top:0">新增一則</h2>
                <label>標題（可空）</label>
                <input type="text" id="oneT" value="">
                <label>內容</label>
                <textarea id="oneB" rows="6"></textarea>
                ${imgEditorHTML()}
                <div class="row-actions">
                    <button class="btn primary" onclick="saveNewItem(${id})">建立</button>
                    <button class="btn ghost" onclick="viewNote(${id})">取消</button>
                </div>
            </div>`;
        renderImgThumbs(); bindImgDrop();
    }
    function saveNewItem(id) {
        const n = notes.find(n => n.id === id);
        if (!n) return;
        if (!Array.isArray(n.items)) n.items = [];
        const t = document.getElementById('oneT').value;
        const b = document.getElementById('oneB').value;
        if (!t.trim() && !b.trim() && !editImgs.length) { imgEditActive = false; viewNote(id); return; }
        n.items.push({ t, b, imgs: editImgs.slice() });
        imgEditActive = false;
        persist(); viewNote(id); setStatus('已新增一則');
    }

    function viewNote(id) {
        currentId = id; imgEditActive = false;
        const n = notes.find(n => n.id === id);
        if (!n) { showWelcome(); return; }
        const tag = n.category
            ? `<span class="cat-tag">🗂️ ${esc(n.category)}</span>`
            : `<span class="cat-tag" style="background:#DAF5EE;color:#9A86A8">未分類</span>`;
        const items = itemsOf(n);
        let body;
        if (items) {
            body = `<div class="qlist">` + items.map((it, idx) => {
                const label = (it.t || '').trim() || ((it.b || '').split('\n')[0].slice(0, 40)) || '（無標題）';
                return `<div class="qitem">
                    <div class="qitem-head" onclick="toggleQ(this)">
                        <span class="qitem-chev">▸</span>
                        <span class="qitem-title">${esc(label)}</span>
                        <button class="item-copy" onclick="event.stopPropagation();copyItem(${id},${idx})">複製</button>
                        <button class="qitem-more" onclick="event.stopPropagation();toggleItemMenu(this)" title="這則的選項">⋯</button>
                        <div class="qitem-menu" hidden>
                            <button onclick="event.stopPropagation();itemToTop(${id},${idx})">移到最上</button>
                            <button onclick="event.stopPropagation();itemEditInline(${id},${idx})">編輯</button>
                            <button class="danger" onclick="event.stopPropagation();itemDelete(${id},${idx})">刪除</button>
                        </div>
                    </div>
                    <div class="qitem-body">${renderItemBody(it.b)}${(Array.isArray(it.imgs) ? it.imgs : []).map(src => `<img src="${src}" class="qitem-img">`).join('')}</div>
                </div>`;
            }).join('') + `</div><button class="btn ghost" style="margin-top:12px" onclick="itemAddNew(${id})">＋ 新增一則</button>`;
        } else {
            body = `<div style="line-height:1.85;white-space:pre-wrap;color:#214A43">${esc(n.content)}</div>`;
        }
        const imgHTML = imgsOf(n).map(src =>
            `<img src="${src}" style="max-width:100%; border-radius:0; margin-top:18px; display:block;">`).join('');
        document.getElementById('contentArea').innerHTML = `
            ${tag}
            <h2 style="margin:10px 0 14px">${n.isPinned ? '📌 ' : ''}${esc(n.title)}</h2>
            <div class="opt-wrap">
                <button class="btn secondary" onclick="toggleOptMenu(event)">⋯ 選項</button>
                <div class="opt-menu" id="optMenu" hidden>
                    <button onclick="togglePin()">${n.isPinned ? '取消置頂' : '置頂'}</button>
                    <button onclick="editMode()">編輯</button>
                    <button class="danger" onclick="deleteNote()">刪除</button>
                </div>
            </div>
            ${body}
            ${imgHTML}`;
    }

    function catDatalist() {
        return `<datalist id="catList">${uniqueCats().map(c => `<option value="${esc(c)}">`).join('')}</datalist>`;
    }

    function newNote() {
        currentId = null; editImgs = []; imgEditActive = true;
        document.getElementById('contentArea').innerHTML = `
            <div class="editor">
                <h2 style="margin-top:0">新增筆記</h2>
                <label>標題</label>
                <input type="text" id="nTitle" placeholder="筆記標題">
                <label>分類（可下拉選現有，或直接輸入新分類）</label>
                <input type="text" id="nCat" list="catList" placeholder="例如：客服話術／排班／工作流程">
                ${catDatalist()}
                <label>內容</label>
                <textarea id="nContent" rows="10" placeholder="輸入內容…"></textarea>
                ${imgEditorHTML()}
                <div class="row-actions">
                    <button class="btn primary" onclick="saveNew()">建立筆記</button>
                    <button class="btn ghost" onclick="showWelcome()">取消</button>
                </div>
            </div>`;
        renderImgThumbs(); bindImgDrop();
    }

    function saveNew() {
        const title = document.getElementById('nTitle').value.trim();
        if (!title) { alert("請輸入標題"); return; }
        const category = document.getElementById('nCat').value.trim();
        const content = document.getElementById('nContent').value;
        const id = Date.now();
        notes.push({ id, title, content: content || '', imgs: editImgs.slice(), img: '', isPinned: false, category });
        imgEditActive = false;
        persist(); render(); viewNote(id);
    }

    function editMode() {
        const n = notes.find(n => n.id === currentId);
        if (!n) return;
        editImgs = imgsOf(n).slice(); imgEditActive = true;
        const items = itemsOf(n);
        if (items) {
            editItems = items.map(it => ({ t: it.t || '', b: it.b || '' }));
            document.getElementById('contentArea').innerHTML = `
                <div class="editor">
                    <label>頁面標題</label>
                    <input type="text" id="editTitle" value="${esc(n.title)}">
                    <label>分類</label>
                    <input type="text" id="editCat" list="catList" value="${esc(n.category || '')}" placeholder="留空＝未分類">
                    ${catDatalist()}
                    <label>項目（↑↓ 調動順序、✕ 刪除）</label>
                    <div id="itemsBox"></div>
                    <button type="button" class="btn ghost" style="margin-top:6px" onclick="addItem()">＋ 新增一則</button>
                    ${imgEditorHTML()}
                    <div class="row-actions">
                        <button class="btn primary" onclick="saveEdit()">保存內容</button>
                        <button class="btn ghost" onclick="viewNote(${n.id})">取消</button>
                    </div>
                </div>`;
            renderItemsEditor(); renderImgThumbs(); bindImgDrop();
        } else {
            document.getElementById('contentArea').innerHTML = `
                <div class="editor">
                    <label>標題</label>
                    <input type="text" id="editTitle" value="${esc(n.title)}">
                    <label>分類</label>
                    <input type="text" id="editCat" list="catList" value="${esc(n.category || '')}" placeholder="留空＝未分類">
                    ${catDatalist()}
                    <label>內容</label>
                    <textarea id="editContent" rows="10">${esc(n.content)}</textarea>
                    ${imgEditorHTML()}
                    <div class="row-actions">
                        <button class="btn primary" onclick="saveEdit()">保存內容</button>
                        <button class="btn ghost" onclick="viewNote(${n.id})">取消</button>
                    </div>
                </div>`;
            renderImgThumbs(); bindImgDrop();
        }
    }

    function saveEdit() {
        const title = document.getElementById('editTitle').value.trim() || '(無標題)';
        const category = document.getElementById('editCat').value.trim();
        if (document.getElementById('itemsBox')) {
            syncItemsFromDOM();
            const items = editItems.filter(it => (it.t || '').trim() || (it.b || '').trim());
            notes = notes.map(n => n.id === currentId ? { ...n, title, category, items, content: '', imgs: editImgs.slice(), img: '' } : n);
            imgEditActive = false; persist(); render(); viewNote(currentId);
            return;
        }
        const content = document.getElementById('editContent').value;
        updateData(title, content, editImgs.slice(), category);
    }

    function updateData(title, content, imgs, category) {
        notes = notes.map(n => n.id === currentId ? { ...n, title, content, imgs, img: '', category } : n);
        imgEditActive = false;
        persist(); render(); viewNote(currentId);
    }

    function togglePin() {
        notes = notes.map(n => n.id === currentId ? { ...n, isPinned: !n.isPinned } : n);
        persist(); render(); viewNote(currentId);
    }

    function deleteNote() {
        if (confirm("確定刪除？")) {
            notes = notes.filter(n => n.id !== currentId);
            persist(); render(); showWelcome();
        }
    }

    // 編輯時 Ctrl+V 貼上圖片
    document.addEventListener('paste', onPasteImage);
    // 密碼鎖：Enter 進入 + 啟動檢查
    document.getElementById('lockInput').addEventListener('keydown', e => { if (e.key === 'Enter') unlockApp(); });
    initLock();

    showWelcome();
    render();
</script>
</body>
</html>
