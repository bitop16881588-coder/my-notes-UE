<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>UE 高效知识库</title>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; display: flex; height: 100vh; margin: 0; background: #f8f9fa; }
        /* 左侧管理区 */
        #sidebar { width: 350px; background: #2c3e50; color: white; display: flex; flex-direction: column; }
        .toolbar { padding: 15px; background: #1a252f; border-bottom: 2px solid #1abc9c; display: flex; gap: 5px; }
        #noteList { flex: 1; overflow-y: auto; }
        .note-item { padding: 15px; border-bottom: 1px solid #3e4f5f; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; }
        .note-item:hover { background: #34495e; }
        /* 右侧展示区 */
        #main { flex: 1; padding: 50px; overflow-y: auto; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; font-size: 12px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="toolbar">
        <button onclick="newNote()" class="btn" style="background:#1abc9c">新建</button>
        <button onclick="syncToCloud()" class="btn" style="background:#f39c12">云同步</button>
        <button onclick="pullFromCloud()" class="btn" style="background:#3498db">刷新</button>
    </div>
    <div id="noteList"></div>
</div>

<div id="main">
    <div id="contentArea" class="card">
        <h2>歡迎使用 UE 知識庫</h2>
        <p>左側點選笔记即可讀取或編輯。</p>
    </div>
</div>

<script>
    let notes = JSON.parse(localStorage.getItem('ueNotes')) || [];
    let currentId = null;
    const GITHUB_CONFIG = {
        token: "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",
        owner: "bitop16881588",
        repo: "bitop16881588-coder",
        path: "data.json"
    };

    // 1. 同步逻辑
    async function pullFromCloud() {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}?t=${Date.now()}`, { headers: { "Authorization": `token ${GITHUB_CONFIG.token}` }});
        const file = await res.json();
        notes = JSON.parse(decodeURIComponent(escape(atob(file.content))));
        localStorage.setItem('ueNotes', JSON.stringify(notes));
        render(); alert("✅ 数据已同步！");
    }

    async function syncToCloud() {
        const getRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`, { headers: { "Authorization": `token ${GITHUB_CONFIG.token}` }});
        const fileData = await getRes.json();
        await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`, {
            method: 'PUT',
            headers: { "Authorization": `token ${GITHUB_CONFIG.token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: "Sync", content: btoa(unescape(encodeURIComponent(JSON.stringify(notes)))), sha: fileData.sha })
        });
        alert("✅ 云同步完成！");
    }

    // 2. 核心功能
    function render() {
        notes.sort((a, b) => (b.isPinned - a.isPinned));
        document.getElementById('noteList').innerHTML = notes.map(n => `
            <div class="note-item" onclick="viewNote(${n.id})">
                <span>${n.isPinned ? '📌 ' : ''}${n.title}</span>
            </div>`).join('');
    }

    function viewNote(id) {
        currentId = id;
        const n = notes.find(n => n.id === id);
        document.getElementById('contentArea').innerHTML = `
            <h2>${n.title}</h2>
            <p style="line-height:1.8;">${n.content}</p>
            ${n.img ? `<img src="${n.img}" style="max-width:100%; border-radius:8px;">` : ''}
            <div style="margin-top:30px;">
                <button class="btn" style="background:#f39c12" onclick="togglePin()">置顶</button>
                <button class="btn" style="background:#3498db" onclick="editMode()">编辑</button>
                <button class="btn" style="background:#e74c3c" onclick="deleteNote()">删除</button>
            </div>`;
    }

    function editMode() {
        const n = notes.find(n => n.id === currentId);
        document.getElementById('contentArea').innerHTML = `
            <input type="text" id="editTitle" value="${n.title}" style="width:100%; padding:10px; margin-bottom:10px;">
            <textarea id="editContent" rows="10" style="width:100%; padding:10px;">${n.content}</textarea>
            <input type="file" id="imgUpload" accept="image/*" style="margin:10px 0;">
            <br><button class="btn" style="background:#27ae60" onclick="saveEdit()">保存内容</button>`;
    }

    function saveEdit() {
        const title = document.getElementById('editTitle').value;
        const content = document.getElementById('editContent').value;
        const file = document.getElementById('imgUpload').files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => updateData(title, content, e.target.result);
            reader.readAsDataURL(file);
        } else updateData(title, content, notes.find(n => n.id === currentId).img);
    }

    function updateData(title, content, img) {
        notes = notes.map(n => n.id === currentId ? {...n, title, content, img} : n);
        localStorage.setItem('ueNotes', JSON.stringify(notes));
        render(); viewNote(currentId);
    }

    function newNote() {
        const title = prompt("标题:");
        if (title) {
            notes.push({ id: Date.now(), title, content: "...", img: "", isPinned: false });
            localStorage.setItem('ueNotes', JSON.stringify(notes));
            render();
        }
    }

    function togglePin() {
        notes = notes.map(n => n.id === currentId ? {...n, isPinned: !n.isPinned} : n);
        localStorage.setItem('ueNotes', JSON.stringify(notes));
        render(); viewNote(currentId);
    }

    function deleteNote() {
        if(confirm("确定删除？")) {
            notes = notes.filter(n => n.id !== currentId);
            localStorage.setItem('ueNotes', JSON.stringify(notes));
            render();
            document.getElementById('contentArea').innerHTML = "<h2>已删除</h2>";
        }
    }

    render();
</script>
</body>
</html>
