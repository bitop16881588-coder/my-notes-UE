<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>UE GitHub 同步笔记系统</title>
    <style>
        /* 样式同前，保持简洁 */
        body { font-family: 'Microsoft JhengHei', sans-serif; display: flex; height: 100vh; margin: 0; background: #f0f2f5; }
        #sidebar { width: 320px; background: #2c3e50; color: white; display: flex; flex-direction: column; height: 100%; }
        #list { flex: 1; overflow-y: auto; }
        .note-item { padding: 15px; border-bottom: 1px solid #34495e; cursor: pointer; }
        #main { flex: 1; padding: 40px; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div style="padding:20px;">
            <input id="token" placeholder="输入 GitHub Token" style="width:100%"><br>
            <button onclick="saveToGitHub()">同步所有修改至 GitHub</button>
        </div>
        <div id="list"></div>
    </div>
    <div id="main"><div id="display">请加载数据</div></div>

    <script>
        let notes = [];
        const REPO = "你的用户名/仓库名"; // 需替换
        const TOKEN = document.getElementById('token').value;

        // 保存到 GitHub 的核心函数
        async function saveToGitHub() {
            const content = JSON.stringify(notes);
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/data.json`, {
                method: 'PUT',
                headers: { "Authorization": `token ${TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: "Update notes",
                    content: btoa(unescape(encodeURIComponent(content))),
                    sha: await getSha() // 需要获取文件的 SHA
                })
            });
            alert("已同步至云端！");
        }
        
        // 此处省略获取 SHA 和加载数据的逻辑...
    </script>
</body>
</html>
