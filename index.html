<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>UE 高效笔记系统 (GitHub云同步版)</title>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; display: flex; height: 100vh; margin: 0; background: #f0f2f5; }
        #sidebar { width: 320px; background: #2c3e50; color: white; display: flex; flex-direction: column; height: 100%; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        .sidebar-header { padding: 20px; background: #1a252f; border-bottom: 2px solid #1abc9c; }
        #noteList { flex: 1; overflow-y: auto; padding: 10px; }
        .note-item { padding: 12px; border-bottom: 1px solid #34495e; cursor: pointer; display: flex; justify-content: space-between; }
        .note-item:hover { background: #34495e; }
        #main { flex: 1; padding: 40px; overflow-y: auto; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; color: white; margin-top: 5px; font-size: 13px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">📂 UE 知识库
        <button onclick="newNote()" style="background:#1abc9c; border:none; padding:5px 10px; color:white; border-radius:4px;">+ 新增</button>
        <button onclick="syncToCloud()" style="background:#f39c12; border:none; padding:5px 10px; color:white; border-radius:4px;">云同步</button>
    </div>
    <div id="noteList"></div>
</div>

<div id="main">
    <div id="contentArea" class="card">
        <h2>系统已就绪</h2>
        <p>请点击左侧目录进行查看、编辑或新增。</p>
    </div>
</div>

<script>
    // 从本地存储读取数据
    let notes = JSON.parse(localStorage.getItem('ueNotes')) || [];
    let currentId = null;

    // 1. 渲染左侧列表
    function render() {
        notes.sort((a, b) => (b.isPinned - a.isPinned));
        document.getElementById('noteList').innerHTML = notes.map(n => `
            <div class="note-item" onclick="viewNote(${n.id})">
                <strong>${n.isPinned ? '📌 ' : ''}${n.title}</strong>
            </div>`).join('');
    }

    // 2. 核心：云同步逻辑 (你需要在此填入你的信息)
    async function syncToCloud() {
        const token = prompt("请输入 GitHub Token:");
        if (!token) return;
        
        const owner = "你的GitHub用户名"; 
        const repo = "你的仓库名";
        const path = "data.json"; // 确保仓库里有这个文件
        
        // 此处省略获取 SHA 并提交的 API 调用逻辑...
        alert("正在同步至云端...");
    }

    // 3. 基础操作逻辑 (编辑、新增、删除)
    function viewNote(id) {
        currentId = id;
        const n = notes.find(n => n.id === id);
        document.getElementById('contentArea').innerHTML = `
            <h2>${n.title}</h2>
            <p style="white-space:pre-wrap;">${n.content}</p>
            ${n.img ? `<img src="${n.img}" style="max-width:100%;">` : ''}
            <br><button class="btn" style="background:#f39c12" onclick="togglePin()">置顶/取消</button>
            <button class="btn" style="background:#3498db" onclick="editMode()">编辑</button>
            <button class="btn" style="background:#e74c3c" onclick="deleteNote()">删除</button>`;
    }
    
    // ... 补充其他 save/delete/editMode 函数 ...

    render();
</script>
</body>
</html>
