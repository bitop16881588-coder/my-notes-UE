<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UE 高效知识库</title>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; display: flex; height: 100vh; margin: 0; background: #f8f9fa; }
        /* 左侧管理区 */
        #sidebar { width: 350px; background: #2c3e50; color: white; display: flex; flex-direction: column; }
        .toolbar { padding: 15px; background: #1a252f; border-bottom: 2px solid #1abc9c; display: flex; gap: 5px; flex-wrap: wrap; }
        #syncStatus { font-size: 11px; color: #9fb3c8; padding: 8px 15px; border-bottom: 1px solid #3e4f5f; }
        #noteList { flex: 1; overflow-y: auto; }
        .note-item { padding: 13px 15px 13px 26px; border-bottom: 1px solid #34404d; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .note-item:hover { background: #34495e; }
        .note-item .pin { color: #f1c40f; }
        /* 分类分组 */
        .cat-group .cat-header { padding: 11px 15px; background: #23303d; color: #9fb3c8; font-size: 12px; font-weight: bold;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none;
            border-bottom: 1px solid #3e4f5f; letter-spacing: .5px; }
        .cat-group .cat-header:hover { background: #2a3a49; color: #cfe0ee; }
        .cat-group .cat-header.pinned { color: #f1c40f; }
        .cat-group .cat-header .left { display: flex; align-items: center; gap: 8px; }
        .cat-group .cat-header .chev { transition: .2s; font-size: 10px; display: inline-block; }
        .cat-group.collapsed .cat-body { display: none; }
        .cat-group.collapsed .chev { transform: rotate(-90deg); }
        .cat-count { background: #1abc9c; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; min-width: 14px; text-align: center; }
        .cat-header.pinned .cat-count { background: #f1c40f; color: #2c3e50; }
        .empty-hint { padding: 20px; color: #9fb3c8; font-size: 13px; line-height: 1.7; }
        /* 右侧展示区 */
        #main { flex: 1; padding: 30px 50px 50px; overflow-y: auto; }
        /* 云端搜寻栏 */
        #searchBar { display: flex; gap: 8px; align-items: center; background: white; border: 1px solid #e1e5ea;
            border-radius: 10px; padding: 8px 8px 8px 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); margin-bottom: 24px; }
        #searchBar input { flex: 1; border: 0; outline: none; font-size: 15px; font-family: inherit; color: #2c3e50; padding: 8px 0; }
        #searchBar .lbl { font-size: 12px; color: #95a5a6; white-space: nowrap; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; font-size: 12px; }
        /* 编辑器 */
        .editor label { display: block; font-size: 13px; color: #7f8c8d; margin: 16px 0 6px; }
        .editor input[type=text], .editor textarea { width: 100%; padding: 11px 13px; border: 1px solid #dfe4ea;
            border-radius: 8px; font-family: inherit; font-size: 14px; box-sizing: border-box; color: #2c3e50; }
        .editor input[type=text]:focus, .editor textarea:focus { outline: none; border-color: #1abc9c; }
        .editor textarea { resize: vertical; line-height: 1.7; }
        .editor .row-actions { margin-top: 22px; display: flex; gap: 10px; }
        .cat-tag { display: inline-block; background: #eef6f4; color: #16a085; font-size: 12px; padding: 3px 12px; border-radius: 20px; }
        /* 搜寻结果 */
        .s-row { display: flex; align-items: center; gap: 14px; text-decoration: none; color: #2c3e50;
            padding: 13px 14px; border: 1px solid #eef1f4; border-radius: 10px; margin-bottom: 8px; transition: 0.15s; }
        .s-row:hover { border-color: #1abc9c; background: #f7fbfa; }
        .s-ic { flex: none; width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; font-size: 19px; background: #eef6f4; }
        .s-meta { flex: 1; min-width: 0; }
        .s-nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .s-sub { font-size: 12px; color: #7f8c8d; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
        .s-sub .tag { color: #16a085; }
        .s-empty { color: #95a5a6; text-align: center; padding: 40px 0; }
        .s-row .imp-btn { background: #1abc9c; flex: none; white-space: nowrap; }
        .s-row .open-link { flex: none; text-decoration: none; color: #95a5a6; font-size: 18px; padding: 0 4px; }
        .s-row .open-link:hover { color: #1abc9c; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="toolbar">
        <button onclick="newNote()" class="btn" style="background:#1abc9c">新建</button>
        <button onclick="syncToCloud()" class="btn" style="background:#f39c12">云同步</button>
        <button onclick="pullFromCloud()" class="btn" style="background:#3498db">刷新</button>
    </div>
    <div id="syncStatus">尚未登入 Google</div>
    <div id="noteList"></div>
</div>

<div id="main">
    <div id="searchBar">
        <span class="lbl">🔍 搜云端</span>
        <input id="q" type="text" placeholder="输入关键字搜你 Google Drive 的档名与内容…　按 Enter" autocomplete="off">
        <button class="btn" style="background:#2c3e50;padding:9px 16px;font-size:13px" onclick="searchDrive()">搜寻</button>
    </div>
    <div id="contentArea" class="card"></div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    let notes = JSON.parse(localStorage.getItem('ueNotes')) || [];
    let currentId = null;

    /* 折叠状态记忆 */
    let collapsed = new Set(JSON.parse(localStorage.getItem('ueCollapsed') || '[]'));

    /* ===== Google 设定：只用可公开的 Client ID，没有任何密钥 ===== */
    const CLIENT_ID = "460796542989-k785gtt8fod50ivj808b7h3le7s4rvnd.apps.googleusercontent.com";
    // 同时请求：唯读全部（搜寻用）+ 只碰自己建立的档（笔记同步用）
    const SCOPE = "https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file";
    const DATA_FILENAME = "ue-notes-data.json";

    let accessToken = null;
    let tokenClient = null;
    let dataFileId = null;
    let pendingAction = null;
    let pendingQuery = "";

    function setStatus(t){ const s = document.getElementById('syncStatus'); if (s) s.textContent = t; }
    function persist(){ localStorage.setItem('ueNotes', JSON.stringify(notes)); }

    window.addEventListener('load', () => {
        const timer = setInterval(() => {
            if (window.google && google.accounts && google.accounts.oauth2) {
                clearInterval(timer);
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPE,
                    callback: (resp) => {
                        if (resp.error) { setStatus("登入失敗：" + resp.error); pendingAction = null; return; }
                        accessToken = resp.access_token;
                        setStatus("已登入 Google Drive");
                        const act = pendingAction; pendingAction = null;
                        if (act === 'sync') doSync();
                        else if (act === 'pull') doPull();
                        else if (act === 'search') doSearch(pendingQuery);
                    },
                });
            }
        }, 200);
    });

    function ensureToken(action) {
        if (accessToken) return true;
        if (!tokenClient) { alert("Google 登入元件還在載入，請稍候再試。"); return false; }
        pendingAction = action;
        tokenClient.requestAccessToken({ prompt: 'consent' });
        return false;
    }

    /* ============ 云端搜寻（drive.readonly，搜档名 + 内容）============ */
    function searchDrive() {
        const kw = document.getElementById('q').value.trim();
        if (!kw) { return; }
        pendingQuery = kw;
        if (ensureToken('search')) doSearch(kw);
    }

    async function doSearch(query) {
        query = (query || '').trim();
        if (!query) return;
        const area = document.getElementById('contentArea');
        area.innerHTML = '<h2>搜尋中…</h2>';
        const safe = query.replace(/'/g, "\\'");
        const q = `(name contains '${safe}' or fullText contains '${safe}') and trashed = false`;
        const params = new URLSearchParams({
            q,
            pageSize: "40",
            fields: "files(id,name,mimeType,modifiedTime,webViewLink,size)",
            orderBy: "modifiedTime desc",
            corpora: "user",
            spaces: "drive",
        });
        try {
            const r = await fetch("https://www.googleapis.com/drive/v3/files?" + params.toString(),
                { headers: { Authorization: 'Bearer ' + accessToken } });
            if (r.status === 401) { accessToken = null; area.innerHTML = '<h2>登入已過期</h2><p>請再按一次「搜尋」重新登入。</p>'; return; }
            if (r.status === 403) { area.innerHTML = '<h2>權限不足（403）</h2><p>請確認 Drive API 已啟用、且授權範圍包含 drive.readonly。</p>'; return; }
            if (!r.ok) { area.innerHTML = '<h2>搜尋失敗（HTTP ' + r.status + '）</h2>'; return; }
            const data = await r.json();
            renderResults(query, data.files || []);
        } catch (e) {
            area.innerHTML = '<h2>發生錯誤</h2><p>' + esc(e.message) + '</p>';
        }
    }

    function renderResults(query, files) {
        const area = document.getElementById('contentArea');
        let html = '<h2 style="margin-top:0">搜尋「' + esc(query) + '」</h2>';
        if (!files.length) {
            html += '<div class="s-empty">🗂️ 找不到符合的檔案</div>';
            area.innerHTML = html; return;
        }
        html += '<p style="color:#7f8c8d;font-size:13px">共 ' + files.length + ' 筆（依修改時間排序）。可匯入的檔案按「📥 匯入成筆記」即可變成可編輯的網頁筆記。</p>';
        window._results = {};
        files.forEach(f => { window._results[f.id] = f; });
        html += files.map(f => {
            const can = canImport(f.mimeType);
            return `
            <div class="s-row">
                <div class="s-ic">${icon(f.mimeType)}</div>
                <div class="s-meta">
                    <div class="s-nm">${esc(f.name)}</div>
                    <div class="s-sub">
                        <span class="tag">${label(f.mimeType)}</span>
                        <span>${fmtDate(f.modifiedTime)}</span>
                        ${f.size ? '<span>' + fmtSize(f.size) + '</span>' : ''}
                    </div>
                </div>
                ${can ? `<button class="btn imp-btn" onclick="importNote('${f.id}')">📥 匯入成筆記</button>` : ''}
                <a class="open-link" href="${f.webViewLink || '#'}" target="_blank" rel="noopener" title="在 Drive 開啟原檔">↗</a>
            </div>`;
        }).join('');
        area.innerHTML = html;
    }

    /* 可匯入成文字筆記的格式：Google 文件、純文字、json/rtf */
    function canImport(m) {
        if (!m) return false;
        if (m === 'application/vnd.google-apps.document') return true;
        if (m === 'application/vnd.google-apps.spreadsheet') return true;
        if (m.startsWith('text/')) return true;
        if (m === 'application/json' || m === 'application/rtf') return true;
        return false;
    }

    /* 把雲端檔案內容讀進來，建立一篇可編輯的網頁筆記 */
    async function importNote(fileId) {
        const f = (window._results || {})[fileId];
        if (!f) { alert('找不到該檔案資料，請重新搜尋後再匯入。'); return; }
        const area = document.getElementById('contentArea');
        area.innerHTML = '<h2>匯入中…</h2>';
        if (f.mimeType === 'application/vnd.google-apps.spreadsheet') { importSheet(fileId, f); return; }
        try {
            const url = (f.mimeType === 'application/vnd.google-apps.document')
                ? `https://www.googleapis.com/drive/v3/files/${fileId}/export?mimeType=text/plain`
                : `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;
            const r = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
            if (r.status === 401) { accessToken = null; area.innerHTML = '<h2>登入已過期</h2><p>請再搜尋一次重新登入後，再按匯入。</p>'; return; }
            if (!r.ok) { area.innerHTML = '<h2>匯入失敗（HTTP ' + r.status + '）</h2><p>此檔案可能不支援文字匯入。</p>'; return; }
            const text = await r.text();
            const id = Date.now();
            const title = f.name.replace(/\.(txt|md|json|rtf)$/i, '');
            notes.push({ id, title, content: text, img: '', isPinned: false, category: '匯入' });
            persist(); render(); viewNote(id);
            setStatus('已匯入「' + f.name + '」，記得按「云同步」存回 Drive');
        } catch (e) {
            area.innerHTML = '<h2>匯入發生錯誤</h2><p>' + esc(e.message) + '</p>';
        }
    }

    /* ===== 從 Google 試算表匯入：每一列變一篇筆記 ===== */
    function parseCSV(text) {
        const rows = []; let row = []; let field = ''; let i = 0; let inQ = false;
        while (i < text.length) {
            const c = text[i];
            if (inQ) {
                if (c === '"') { if (text[i + 1] === '"') { field += '"'; i += 2; continue; } inQ = false; i++; continue; }
                field += c; i++; continue;
            } else {
                if (c === '"') { inQ = true; i++; continue; }
                if (c === ',') { row.push(field); field = ''; i++; continue; }
                if (c === '\r') { i++; continue; }
                if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
                field += c; i++; continue;
            }
        }
        if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
        return rows;
    }

    async function importSheet(fileId, f) {
        const area = document.getElementById('contentArea');
        try {
            const url = `https://www.googleapis.com/drive/v3/files/${fileId}/export?mimeType=text/csv`;
            const r = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
            if (r.status === 401) { accessToken = null; area.innerHTML = '<h2>登入已過期</h2><p>請再搜尋一次重新登入後，再按匯入。</p>'; return; }
            if (!r.ok) { area.innerHTML = '<h2>讀取試算表失敗（HTTP ' + r.status + '）</h2>'; return; }
            const text = await r.text();
            const rows = parseCSV(text).filter(row => row.some(c => (c || '').trim() !== ''));
            if (!rows.length) { area.innerHTML = '<h2>這份試算表是空的</h2>'; return; }
            window._sheetRows = rows;
            renderSheetMapping(rows, f.name);
        } catch (e) {
            area.innerHTML = '<h2>讀取試算表發生錯誤</h2><p>' + esc(e.message) + '</p>';
        }
    }

    function renderSheetMapping(rows, name) {
        const cols = Math.max(...rows.map(r => r.length));
        const head = rows[0] || [];
        const colLabel = k => '第' + (k + 1) + '欄' + (head[k] ? '（' + esc(String(head[k]).slice(0, 12)) + '）' : '');
        const opt = (sel) => { let s = ''; for (let k = 0; k < cols; k++) s += `<option value="${k}" ${k === sel ? 'selected' : ''}>${colLabel(k)}</option>`; return s; };
        const catOpt = () => { let s = '<option value="-1" selected>（不指定，全部歸到「匯入」）</option>'; for (let k = 0; k < cols; k++) s += `<option value="${k}">${colLabel(k)}</option>`; return s; };
        const prev = rows.slice(0, 4).map(r => '<tr>' + Array.from({ length: cols }, (_, k) =>
            '<td style="border:1px solid #e1e5ea;padding:5px 8px;font-size:12px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(String(r[k] ?? '')) + '</td>').join('') + '</tr>').join('');
        const selStyle = 'width:100%;padding:10px;border:1px solid #dfe4ea;border-radius:8px;font-family:inherit;font-size:14px;color:#2c3e50';
        document.getElementById('contentArea').innerHTML = `
            <div class="editor">
                <h2 style="margin-top:0">匯入試算表：${esc(name)}</h2>
                <p style="color:#7f8c8d;font-size:13px">共 ${rows.length} 列、${cols} 欄。指定下面三項後，每一列會變成一篇筆記。</p>
                <div style="overflow-x:auto;margin:8px 0 2px"><table style="border-collapse:collapse">${prev}</table></div>
                <p style="color:#95a5a6;font-size:12px;margin:0 0 4px">↑ 預覽前幾列</p>
                <label>標題欄</label>
                <select id="mapTitle" style="${selStyle}">${opt(0)}</select>
                <label>內容欄</label>
                <select id="mapContent" style="${selStyle}">${opt(cols > 1 ? 1 : 0)}</select>
                <label>分類欄（可不選）</label>
                <select id="mapCat" style="${selStyle}">${catOpt()}</select>
                <label style="display:flex;align-items:center;gap:8px;margin-top:16px;cursor:pointer;color:#566573">
                    <input type="checkbox" id="mapHeader" checked> 第一列是標題列（略過不匯入）
                </label>
                <div class="row-actions">
                    <button class="btn" style="background:#27ae60" onclick="doImportSheet()">開始匯入</button>
                    <button class="btn" style="background:#95a5a6" onclick="showWelcome()">取消</button>
                </div>
            </div>`;
    }

    function doImportSheet() {
        const rows = window._sheetRows || [];
        const tI = +document.getElementById('mapTitle').value;
        const cI = +document.getElementById('mapContent').value;
        const catI = +document.getElementById('mapCat').value;
        const skip = document.getElementById('mapHeader').checked;
        const data = skip ? rows.slice(1) : rows;
        let added = 0, firstId = null;
        data.forEach(r => {
            const title = (r[tI] || '').trim();
            const content = (r[cI] || '').trim();
            if (!title && !content) return;
            const category = catI >= 0 ? (r[catI] || '').trim() : '匯入';
            const id = Date.now() + added;
            if (firstId === null) firstId = id;
            notes.push({ id, title: title || '(無標題)', content, img: '', isPinned: false, category });
            added++;
        });
        persist(); render();
        if (added) { viewNote(firstId); setStatus('已從試算表匯入 ' + added + ' 篇，記得按「云同步」存回 Drive'); }
        else { showWelcome(); alert('沒有可匯入的資料列。'); }
    }

    function icon(m){ if(!m)return"📄"; if(m.includes("folder"))return"📁"; if(m.includes("document"))return"📝";
        if(m.includes("spreadsheet"))return"📊"; if(m.includes("presentation"))return"📽️"; if(m==="application/pdf")return"📕";
        if(m.startsWith("image/"))return"🖼️"; if(m.startsWith("video/"))return"🎬"; if(m.startsWith("audio/"))return"🎵"; return"📄"; }
    function label(m){ if(!m)return"檔案"; if(m.includes("folder"))return"資料夾"; if(m.includes("document"))return"Google 文件";
        if(m.includes("spreadsheet"))return"Google 試算表"; if(m.includes("presentation"))return"Google 簡報"; if(m==="application/pdf")return"PDF";
        if(m.startsWith("image/"))return"圖片"; if(m.startsWith("video/"))return"影片"; return"檔案"; }
    function fmtDate(s){ if(!s)return""; const d=new Date(s); return d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0"); }
    function fmtSize(b){ b=+b; if(!b)return""; const u=["B","KB","MB","GB"]; let i=0; while(b>=1024&&i<u.length-1){b/=1024;i++;} return b.toFixed(b<10&&i>0?1:0)+u[i]; }
    function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

    /* ============ 笔记同步到 Google Drive（drive.file）============ */
    async function findDataFile() {
        if (dataFileId) return dataFileId;
        const q = encodeURIComponent(`name='${DATA_FILENAME}' and trashed=false`);
        const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`,
            { headers: { Authorization: 'Bearer ' + accessToken } });
        if (r.status === 401) { accessToken = null; throw { code: 401 }; }
        if (!r.ok) throw new Error('查詢檔案失敗 HTTP ' + r.status);
        const d = await r.json();
        if (d.files && d.files.length) dataFileId = d.files[0].id;
        return dataFileId;
    }

    function syncToCloud(){ if (ensureToken('sync')) doSync(); }
    async function doSync() {
        try {
            setStatus("同步中…");
            const body = JSON.stringify(notes);
            let id = await findDataFile();
            let r;
            if (id) {
                r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,
                    { method: 'PATCH', headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' }, body });
            } else {
                const boundary = 'ueb' + Date.now();
                const meta = { name: DATA_FILENAME, mimeType: 'application/json' };
                const multipart =
                    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n` +
                    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
                r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
                    { method: 'POST', headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'multipart/related; boundary=' + boundary }, body: multipart });
                if (r.ok) { const d = await r.json(); dataFileId = d.id; }
            }
            if (r.status === 401) { accessToken = null; setStatus("登入過期"); alert("登入已過期，請再按一次「云同步」。"); return; }
            if (!r.ok) { console.error(await r.text()); setStatus("同步失敗 HTTP " + r.status); alert("❌ 同步失敗（HTTP " + r.status + "）"); return; }
            localStorage.setItem('ueNotes', JSON.stringify(notes));
            setStatus("已同步到 Google Drive ✓");
            alert("✅ 云同步完成！（已存到你的 Google Drive）");
        } catch (e) {
            if (e && e.code === 401) { setStatus("登入過期"); alert("登入已過期，請再按一次「云同步」。"); return; }
            setStatus("同步錯誤"); alert("同步發生錯誤：" + (e.message || e));
        }
    }

    function pullFromCloud(){ if (ensureToken('pull')) doPull(); }
    async function doPull() {
        try {
            setStatus("讀取中…");
            const id = await findDataFile();
            if (!id) { setStatus("雲端尚無資料"); alert("雲端還沒有資料（你還沒同步過）。"); return; }
            const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,
                { headers: { Authorization: 'Bearer ' + accessToken } });
            if (r.status === 401) { accessToken = null; setStatus("登入過期"); alert("登入已過期，請再按一次「刷新」。"); return; }
            if (!r.ok) { setStatus("讀取失敗 HTTP " + r.status); alert("❌ 讀取失敗（HTTP " + r.status + "）"); return; }
            notes = await r.json();
            // 旧资料相容：补上 category 栏位
            notes = (notes || []).map(n => ({ category: '', ...n }));
            localStorage.setItem('ueNotes', JSON.stringify(notes));
            render();
            setStatus("已從 Google Drive 載入 ✓");
            alert("✅ 数据已同步！");
        } catch (e) {
            if (e && e.code === 401) { setStatus("登入過期"); alert("登入已過期，請再按一次「刷新」。"); return; }
            setStatus("讀取錯誤"); alert("讀取發生錯誤：" + (e.message || e));
        }
    }

    /* ============ 分类与侧栏渲染 ============ */
    function uniqueCats() {
        const set = new Set();
        notes.forEach(n => { const c = (n.category || '').trim(); if (c) set.add(c); });
        return [...set].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
    }

    function toggleCat(key) {
        if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key);
        localStorage.setItem('ueCollapsed', JSON.stringify([...collapsed]));
        render();
    }

    function noteItemHTML(n) {
        return `<div class="note-item" onclick="viewNote(${n.id})">
            <span>${n.isPinned ? '<span class="pin">📌</span> ' : ''}${esc(n.title)}</span>
        </div>`;
    }

    function groupHTML(key, name, items, pinned) {
        const col = collapsed.has(key);
        return `<div class="cat-group ${col ? 'collapsed' : ''}">
            <div class="cat-header ${pinned ? 'pinned' : ''}" data-key="${esc(key)}">
                <span class="left"><span class="chev">▾</span>${esc(name)}</span>
                <span class="cat-count">${items.length}</span>
            </div>
            <div class="cat-body">${items.map(noteItemHTML).join('')}</div>
        </div>`;
    }

    function render() {
        const list = document.getElementById('noteList');
        if (!notes.length) {
            list.innerHTML = '<div class="empty-hint">還沒有筆記。<br>按上方「新建」開始建立，並可指定分類。</div>';
            return;
        }
        let html = '';
        const pinned = notes.filter(n => n.isPinned);
        if (pinned.length) html += groupHTML('__pinned__', '📌 置頂', pinned, true);

        const order = [...uniqueCats(), '']; // '' = 未分类，排最后
        order.forEach(cat => {
            const items = notes.filter(n => !n.isPinned && (n.category || '') === cat);
            if (!items.length) return;
            html += groupHTML(cat || '__uncat__', cat || '未分類', items, false);
        });
        list.innerHTML = html;
    }

    /* 折叠点击（事件委派，避免分类名含特殊字元出错）*/
    document.getElementById('noteList').addEventListener('click', e => {
        const h = e.target.closest('.cat-header');
        if (h) toggleCat(h.dataset.key);
    });

    /* ============ 查看 / 编辑 / 新增 ============ */
    function welcomeHTML() {
        return `<h2>歡迎使用 UE 知識庫</h2>
            <p style="line-height:1.8;color:#566573">左側依分類點選筆記即可讀取或編輯；按「新建」可建立筆記並指定分類。<br>
            上方搜尋欄可搜尋你 Google Drive 裡的檔案與內容。第一次使用會請你登入 Google。</p>`;
    }
    function showWelcome(){ currentId = null; document.getElementById('contentArea').innerHTML = welcomeHTML(); }

    function viewNote(id) {
        currentId = id;
        const n = notes.find(n => n.id === id);
        if (!n) { showWelcome(); return; }
        const tag = n.category
            ? `<span class="cat-tag">🗂️ ${esc(n.category)}</span>`
            : `<span class="cat-tag" style="background:#f0f0f0;color:#999">未分類</span>`;
        document.getElementById('contentArea').innerHTML = `
            ${tag}
            <h2 style="margin:10px 0 18px">${n.isPinned ? '📌 ' : ''}${esc(n.title)}</h2>
            <div style="line-height:1.85;white-space:pre-wrap;color:#2c3e50">${esc(n.content)}</div>
            ${n.img ? `<img src="${n.img}" style="max-width:100%; border-radius:8px; margin-top:18px;">` : ''}
            <div style="margin-top:30px;display:flex;gap:10px;">
                <button class="btn" style="background:#f39c12" onclick="togglePin()">${n.isPinned ? '取消置頂' : '置頂'}</button>
                <button class="btn" style="background:#3498db" onclick="editMode()">編輯</button>
                <button class="btn" style="background:#e74c3c" onclick="deleteNote()">刪除</button>
            </div>`;
    }

    function catDatalist() {
        return `<datalist id="catList">${uniqueCats().map(c => `<option value="${esc(c)}">`).join('')}</datalist>`;
    }

    function newNote() {
        currentId = null;
        document.getElementById('contentArea').innerHTML = `
            <div class="editor">
                <h2 style="margin-top:0">新增筆記</h2>
                <label>標題</label>
                <input type="text" id="nTitle" placeholder="筆記標題">
                <label>分類（可下拉選現有，或直接輸入新分類）</label>
                <input type="text" id="nCat" list="catList" placeholder="例如：客服話術／排班／工作流程">
                ${catDatalist()}
                <label>內容</label>
                <textarea id="nContent" rows="10" placeholder="輸入內容…"></textarea>
                <label>圖片（可選）</label>
                <input type="file" id="nImg" accept="image/*">
                <div class="row-actions">
                    <button class="btn" style="background:#27ae60" onclick="saveNew()">建立筆記</button>
                    <button class="btn" style="background:#95a5a6" onclick="showWelcome()">取消</button>
                </div>
            </div>`;
    }

    function saveNew() {
        const title = document.getElementById('nTitle').value.trim();
        if (!title) { alert("請輸入標題"); return; }
        const category = document.getElementById('nCat').value.trim();
        const content = document.getElementById('nContent').value;
        const file = document.getElementById('nImg').files[0];
        const commit = (img) => {
            const id = Date.now();
            notes.push({ id, title, content: content || '', img: img || '', isPinned: false, category });
            persist(); render(); viewNote(id);
        };
        if (file) { const r = new FileReader(); r.onload = e => commit(e.target.result); r.readAsDataURL(file); }
        else commit('');
    }

    function editMode() {
        const n = notes.find(n => n.id === currentId);
        if (!n) return;
        document.getElementById('contentArea').innerHTML = `
            <div class="editor">
                <label>標題</label>
                <input type="text" id="editTitle" value="${esc(n.title)}">
                <label>分類</label>
                <input type="text" id="editCat" list="catList" value="${esc(n.category || '')}" placeholder="留空＝未分類">
                ${catDatalist()}
                <label>內容</label>
                <textarea id="editContent" rows="10">${esc(n.content)}</textarea>
                <label>更換圖片（可選）</label>
                <input type="file" id="imgUpload" accept="image/*">
                <div class="row-actions">
                    <button class="btn" style="background:#27ae60" onclick="saveEdit()">保存內容</button>
                    <button class="btn" style="background:#95a5a6" onclick="viewNote(${n.id})">取消</button>
                </div>
            </div>`;
    }

    function saveEdit() {
        const title = document.getElementById('editTitle').value.trim() || '(無標題)';
        const category = document.getElementById('editCat').value.trim();
        const content = document.getElementById('editContent').value;
        const file = document.getElementById('imgUpload').files[0];
        const cur = notes.find(n => n.id === currentId);
        if (file) {
            const reader = new FileReader();
            reader.onload = e => updateData(title, content, e.target.result, category);
            reader.readAsDataURL(file);
        } else updateData(title, content, cur ? cur.img : '', category);
    }

    function updateData(title, content, img, category) {
        notes = notes.map(n => n.id === currentId ? { ...n, title, content, img, category } : n);
        persist(); render(); viewNote(currentId);
    }

    function togglePin() {
        notes = notes.map(n => n.id === currentId ? { ...n, isPinned: !n.isPinned } : n);
        persist(); render(); viewNote(currentId);
    }

    function deleteNote() {
        if (confirm("確定刪除？")) {
            notes = notes.filter(n => n.id !== currentId);
            persist(); render(); showWelcome();
        }
    }

    // Enter 键搜寻
    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') searchDrive(); });

    showWelcome();
    render();
</script>
</body>
</html>
