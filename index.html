<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>UE 管理员笔记系统</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        // !!! 填入你在 Firebase 申请的配置 !!!
        const firebaseConfig = { apiKey: "...", projectId: "...", ... };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 实时渲染
        onSnapshot(query(collection(db, "notes"), orderBy("isPinned", "desc")), (snapshot) => {
            const list = document.getElementById('list');
            list.innerHTML = "";
            snapshot.forEach(doc => {
                const n = doc.data();
                list.innerHTML += `
                    <div class="note-item" onclick="view('${doc.id}')">
                        ${n.isPinned ? '📌 ' : ''}${n.title}
                    </div>`;
            });
        });

        // 管理功能：新增
        window.saveNote = async () => {
            const title = document.getElementById('newTitle').value;
            const content = document.getElementById('newContent').value;
            await addDoc(collection(db, "notes"), { title, content, isPinned: false });
        };
    </script>
</head>
<body>
    <div id="sidebar">
        <div class="header">📂 UE 管理后台</div>
        <div id="list"></div>
        <div style="padding:10px;">
            <input id="newTitle" placeholder="标题"><br>
            <textarea id="newContent" placeholder="内容"></textarea><br>
            <button onclick="saveNote()">发布新笔记</button>
        </div>
    </div>
    <div id="main"><div id="display" class="card">请选择笔记</div></div>
</body>
</html>
