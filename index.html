<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>UE 多人协作笔记</title>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
        #sidebar { width: 300px; background: #2c3e50; color: white; padding: 20px; overflow-y: auto; }
        #main { flex: 1; padding: 40px; }
    </style>
</head>
<body>
    <div id="sidebar"><h3>笔记目录</h3><div id="list"></div></div>
    <div id="main"><div id="display">请选择笔记</div></div>

    <script>
        // 核心：从你的 GitHub 仓库实时读取 data.json
        async function loadNotes() {
            const res = await fetch('data.json?t=' + new Date().getTime()); // 加上时间戳防止缓存
            const notes = await res.json();
            renderList(notes);
        }

        function renderList(notes) {
            const list = document.getElementById('list');
            list.innerHTML = notes.map(n => `<div onclick="view(${n.id})" style="cursor:pointer; padding:10px;">${n.title}</div>`).join('');
            window.allNotes = notes;
        }

        function view(id) {
            const n = allNotes.find(item => item.id === id);
            document.getElementById('display').innerHTML = `<h2>${n.title}</h2><p>${n.content}</p>`;
        }

        loadNotes();
    </script>
</body>
</html>
